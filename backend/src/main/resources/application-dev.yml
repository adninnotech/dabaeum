server:
  # 호스트 nginx 뒤에서 돈다. nginx 가 넘기는 X-Forwarded-For 로 실제 클라이언트 주소를 읽는다(관리자 접속기록의 접속지).
  # Tomcat 은 내부망 주소(127.0.0.1 등)에서 온 헤더만 믿는다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.0\.0\.1|::1'

spring:
  datasource:
    url: ${DABAEUM_DB_URL:jdbc:postgresql://127.0.0.1:15432/dabaeum_dev}
    username: ${DABAEUM_DB_USERNAME}
    password: ${DABAEUM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

dabaeum:
  http-logging:
    # 인터넷에 노출된 dev 서버는 본문과 쿼리값을 기록하지 않는다.
    body-enabled: false
    mask-sensitive: true
  fabric:
    worker:
      enabled: true
  kms:
    recovery:
      enabled: true
  # 비밀은 서버 env 파일(dev-secrets.env.example 참고)에서만 받는다. 기본값이 없어 빠지면 기동이 실패한다.
  security:
    local-account:
      jwt:
        key-id: ${DABAEUM_JWT_KEY_ID}
        signing-key: ${DABAEUM_JWT_SIGNING_KEY}
    dadaegu:
      site-id: ${DABAEUM_DADAEGU_SITE_ID}
      private-key: ${DABAEUM_DADAEGU_PRIVATE_KEY}
  nft:
    # ledger=daeguchain 일 때만 쓴다. 키 파일 ~/dabaeum/daeguchain-wallet.env 에서 읽는다.
    wallet-private-key: ${DABAEUM_NFT_OWNER_PRIVATE_KEY:}

springdoc:
  api-docs:
    enabled: true
  enable-default-api-docs: false
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    config-url: /openapi/swagger-config
    url: /openapi/dabaeum-api-v1.yaml

mybatis:
  configuration:
    log-impl: com.adn.dabaeum.common.logging.SanitizedMyBatisLog

logging:
  level:
    com.adn.dabaeum.common.web.HttpTrafficLoggingFilter: INFO
    com.adn.dabaeum.attendance.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.completion.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.course.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.enrollment.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.identity.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.institution.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.role.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.user.infrastructure.mybatis: DEBUG
