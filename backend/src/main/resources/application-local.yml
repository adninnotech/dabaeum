dabaeum:
  http-logging:
    # 개발에서는 요청·응답 본문을 마스킹 없이 그대로 남긴다. 운영 프로필에는 이 필터 자체가 없다.
    mask-sensitive: false
  ssh-tunnel:
    enabled: true
    host: 118.45.182.100
    port: 22880
    username: ${DABAEUM_SSH_USERNAME}
    password: ${DABAEUM_SSH_PASSWORD}
    local-host: 127.0.0.1
    local-port: 15432
    remote-host: 127.0.0.1
    remote-port: 15432
    known-hosts-path: ${DABAEUM_SSH_KNOWN_HOSTS:${user.home}/.ssh/known_hosts}
    connect-timeout: 10s
    auth-timeout: 10s
  security:
    dev:
      bearer-token: ${DABAEUM_DEV_BEARER_TOKEN:adninnotech}
    # 프론트 개발 서버가 localhost 출처에서 API 를 부른다. dev·운영은 비워 둔다(닫힘).
    cors:
      allowed-origins: http://localhost:*,http://127.0.0.1:*
    # local 전용 JWT 키. dev 는 서버 env 로 받고, dev 에서 local-* kid 로 뜨면 기동을 거부한다.
    local-account:
      jwt:
        key-id: local-1
        signing-key: ${DABAEUM_JWT_SIGNING_KEY}
    # 다대구(대구체인) QR 로그인. private-key 는 포털에서 받은 RSA 개인키(PKCS#8 Base64 한 줄).
    # 로그인은 requiredVC=Name:PhoneNum:Birthdate 로 요청한다 — 이름·전화·생년월일을
    # 복호화해 tb_users 에 저장하고, ci·성별·내외국인은 받아도 무시한다.
    dadaegu:
      site-id: ${DABAEUM_DADAEGU_SITE_ID}
      private-key: ${DABAEUM_DADAEGU_PRIVATE_KEY}

spring:
  config:
    # 비밀은 프로젝트 루트의 local-secrets.env(커밋 안 함)에서 읽는다. 이름은 local-secrets.env.example 을 본다.
    import: optional:file:local-secrets.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/dabaeum_dev
    username: ${DABAEUM_DB_USERNAME}
    password: ${DABAEUM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  enable-default-api-docs: false
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    config-url: /openapi/swagger-config
    url: /openapi/dabaeum-api-v1.yaml

mybatis:
  configuration:
    log-impl: com.adn.dabaeum.common.logging.SanitizedMyBatisLog

logging:
  level:
    com.adn.dabaeum.common.web.HttpTrafficLoggingFilter: INFO
    com.adn.dabaeum.attendance.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.completion.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.course.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.enrollment.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.identity.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.institution.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.role.infrastructure.mybatis: DEBUG
    com.adn.dabaeum.user.infrastructure.mybatis: DEBUG
