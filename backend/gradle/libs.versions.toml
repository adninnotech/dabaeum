[versions]
mybatis = "4.0.1"
sshd = "2.16.0"
archunit = "1.4.1"
swaggerParser = "2.1.41"
openapiValidator = "3.0.0"
springdoc = "3.0.2"
springCloud = "2025.1.3"
jaxbApi = "2.3.1"
jsoup = "1.18.1"

[libraries]
mybatis-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis" }
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swaggerParser" }
openapi-mockmvc = { module = "com.atlassian.oai:openapi-request-validator-mockmvc", version.ref = "openapiValidator" }
springdoc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
spring-vault-core = { module = "org.springframework.vault:spring-vault-core" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxbApi" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }
restdocs-asciidoctor = { module = "org.springframework.restdocs:spring-restdocs-asciidoctor" }
