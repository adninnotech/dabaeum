      properties:
        did: {type: string, minLength: 1, maxLength: 4096}
        name: {type: [string, 'null'], maxLength: 4096}
        birthdate: {type: [string, 'null'], maxLength: 4096}
        phoneNumber: {type: [string, 'null'], maxLength: 4096}
        ci: {type: [string, 'null'], maxLength: 4096}
        gender: {type: [string, 'null'], maxLength: 4096}
        isForeigner: {type: [string, 'null'], maxLength: 4096}
