    BlockchainTransactionSummary:
      type: object
      additionalProperties: false
      description: >-
        원장 트랜잭션 요약. txHash 는 원장 트랜잭션 ID이며 실패 건은 null 입니다.
        occurredAt 은 화면 정렬용 대표 시각으로 confirmedAt → requestedAt → 생성 시각 순으로
        첫 번째 존재하는 값입니다. 의미가 명확한 시각이 필요하면 requestedAt·confirmedAt 을 쓰세요.
      required: [id, type, status, occurredAt, requestedAt, reconciled]
      properties:
        id: {type: string, format: uuid}
        txHash: {type: [string, 'null'], maxLength: 255}
        type: {type: string, maxLength: 50}
        status: {type: string, enum: [PENDING, PROCESSING, CONFIRMED, FAILED]}
        occurredAt: {type: string, format: date-time}
        requestedAt: {type: string, format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        blockNumber:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: 트랜잭션이 커밋된 블록 번호. 커밋 결과를 받지 못한 건(재조정 등)은 null 입니다.
        reconciled:
          type: boolean
          description: >-
            제출 결과 대신 원장 상태를 대조해 확정한 건이면 true 입니다. 이때 txHash 는 원장 이력에서
            찾은 실제 ID 이며, 이력을 읽지 못해 ID 를 확인할 수 없으면 null 입니다.
    BlockchainTransactionPageResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BlockchainTransactionSummary'}
        page: {$ref: '#/components/schemas/PageMeta'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
