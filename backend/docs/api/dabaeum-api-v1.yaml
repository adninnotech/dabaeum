      description: 다배움 평생교육 이수 VC의 custom term을 정의한 변경 불가능한 v1 Context입니다. 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: JSON-LD Context
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/VcContextDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/vocabulary/lifelong-education/v1:
    get:
      operationId: getLifelongEducationVocabularyV1
      tags: [VC Public]
      summary: 평생교육 VC 용어 문서 조회
      description: v1 Context에서 사용하는 용어 URL, 한글 설명과 값 형식을 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 평생교육 VC vocabulary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcVocabularyDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/issuers/{institutionId}:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    get:
      operationId: getCredentialIssuer
      tags: [VC Public]
      summary: Credential 발급기관 공개키 조회
      description: 기관이 발급한 VC의 JOSE kid가 가리키는 W3C Controlled Identifier 문서와 Ed25519 public JWK를 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 기관 Controlled Identifier 문서
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/CredentialIssuerDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/status/{credentialNo}:
    parameters:
      - name: credentialNo
        in: path
        required: true
        description: 공개 검증할 Credential 번호입니다.
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'}
    get:
      operationId: getPublicCredentialStatus
      tags: [VC Public]
      summary: Credential 공개 상태 조회
      description: 실제 원장(대구체인) Provider 가 붙어 있을 때 DB·서명·저장 hash·원장 상태를 검증하고 최소 상태 정보만 반환합니다. 인증 없이 호출할 수 있으며 실제 원장 검증 서비스가 없으면 503을 반환합니다.
      security: []
      responses:
        '200':
          description: 공개 Credential 상태
          headers:
            Cache-Control:
              description: 상태 응답 캐시를 금지합니다.
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicCredentialStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/status-lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        description: 발급기관별 Bitstring Status List 식별자입니다. VC의 credentialStatus.statusListCredential이 가리킵니다.
        schema: {type: string, format: uuid}
    get:
      operationId: getCredentialStatusList
      tags: [VC Public]
      summary: Credential 폐기 상태 리스트 조회
      description: W3C Bitstring Status List v1.0 규격의 BitstringStatusListCredential을 인증 없이 조회합니다. 리스트 하나가 발급기관 수료증 최대 131,072장의 폐기 여부를 비트 하나씩으로 담고, 개인정보·이수 정보는 포함하지 않습니다. 검증자는 VC의 statusListIndex 번째 비트가 1이면 폐기로 판정합니다. 발급기관 키로 서명한 Compact JWS를 반환하며 서명 서비스가 없으면 503을 반환합니다.
      security: []
      responses:
        '200':
          description: BitstringStatusListCredential Compact JWS
          headers:
            Cache-Control:
              description: 검증자가 리스트를 최대 60초 캐시할 수 있습니다.
              schema: {type: string}
          content:
            application/vc+jwt:
              schema: {type: string, description: Compact JWS}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
