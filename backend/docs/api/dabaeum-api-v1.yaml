        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /blockchain/alerts:
    get:
      operationId: listBlockchainAlerts
      tags: [Support]
      summary: 체인 이상 징후 목록 조회
      description: 실패한 블록체인 트랜잭션을 이상 징후로 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/BlockchainAlertPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /files:
    post:
      operationId: uploadFile
      tags: [File]
      summary: 파일 업로드
      description: 프로필 이미지·과정 썸네일·문의 첨부 파일을 업로드합니다. 서버 디스크에 저장되고 응답의 url로 조회할 수 있습니다. 이미지는 JPEG·PNG·WebP, 문의 첨부는 PDF까지 허용하며 최대 10MB입니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/FileUploadRequest'}
      responses:
        '201': {$ref: '#/components/responses/StoredFileCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /files/{fileId}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: downloadFileContent
      tags: [File]
      summary: 파일 내용 조회
      description: 업로드된 파일의 바이트를 저장된 Content-Type으로 반환합니다. 프로필 이미지·썸네일 표시용이므로 인증 없이 사용할 수 있습니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/FileContentOk'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/password/reset:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    post:
      operationId: adminResetPassword
      tags: [Auth]
      summary: 관리자 비밀번호 초기화
      description: 플랫폼 관리자가 사용자 비밀번호를 임시 비밀번호로 초기화합니다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordResetRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdminPasswordResetOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
