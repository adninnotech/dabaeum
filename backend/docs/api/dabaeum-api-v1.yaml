      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: cancelEnrollment
      tags: [Enrollment]
      summary: 수강신청 취소
      description: 승인 전후 정책에 따라 수강신청을 취소합니다.
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/withdraw:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: withdrawEnrollment
