        updatedAt: {type: string, format: date-time}
    AttendanceCreateRequest:
      type: object
      additionalProperties: false
      required: [enrollmentId, attendanceMethod, status, source]
      properties:
        enrollmentId: {type: string, format: uuid}
        attendanceMethod: {type: string, enum: [QR, ADMIN, EXTERNAL]}
        status: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        checkedAt: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [APP, ADMIN_WEB, EXTERNAL_API]}
        qrToken:
          type: [string, 'null']
          minLength: 32
          maxLength: 2048
          description: required when attendanceMethod=QR; forbidden for ADMIN and EXTERNAL.
    AttendanceAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    AttendanceSummary:
      type: object
      additionalProperties: false
      required:
        [enrollmentId, totalSessions, presentCount, lateCount, absentCount,
         excusedCount, attendanceRate, completedMinutes]
      properties:
        enrollmentId: {type: string, format: uuid}
        totalSessions: {type: integer, format: int32, minimum: 0}
        presentCount: {type: integer, format: int32, minimum: 0}
        lateCount: {type: integer, format: int32, minimum: 0}
        absentCount: {type: integer, format: int32, minimum: 0}
        excusedCount: {type: integer, format: int32, minimum: 0}
        attendanceRate: {type: number, format: double, minimum: 0, maximum: 100}
        completedMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >-
            출석 인정(PRESENT·LATE) 회차의 진행 시간 합계(분)입니다.
            evaluateCompletion 이 서버 계산값과 정확히 일치할 것을 요구하므로,
            이수 평가 요청의 completedMinutes 에 이 값을 그대로 사용합니다.
    Completion:
      type: object
      additionalProperties: false
      required:
        [id, enrollmentId, status, attendanceRate, completedMinutes, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        status:
          type: string
          enum: [PENDING_EVALUATION, ELIGIBLE, COMPLETED, NOT_COMPLETED, CANCELLED]
        attendanceRate: {type: number, format: double, minimum: 0, maximum: 100}
        completedMinutes: {type: integer, format: int32, minimum: 0}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        evaluatedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        confirmedBy: {type: [string, 'null'], format: uuid}
        confirmedAt: {type: [string, 'null'], format: date-time}
        failureReason: {type: [string, 'null'], maxLength: 1000}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CorrectionReasonRequest:
      type: object
      additionalProperties: false
      description: >-
        관리자 정정 공통 요청. 사유는 tb_admin_corrections 에 감사 이력으로 남으므로 필수입니다.
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CompletionEvaluationRequest:
      type: object
      additionalProperties: false
      description: >-
        출석률·이수시간·학점은 서버가 출결 기록과 과정 정책으로 계산해 판정합니다.
        보낸 값은 참고용이며 서버 계산값과 달라도 거부하지 않습니다. 판정에 쓰인 값은
        응답의 attendanceRate·completedMinutes·creditValue 에 담깁니다. 빈 본문(`{}`)도 허용됩니다.
      properties:
        attendanceRate: {type: [number, 'null'], format: double, minimum: 0, maximum: 100}
        completedMinutes: {type: [integer, 'null'], format: int32, minimum: 0}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        failureReason: {type: [string, 'null'], maxLength: 1000}
    Credential:
