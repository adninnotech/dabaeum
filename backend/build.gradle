plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.4'
}

group = 'com.adn'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

asciidoctorj {
    version = '3.0.0'
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java.setSrcDirs(['src/integrationTest/java'])
        resources.setSrcDirs(['src/integrationTest/resources'])
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    openbaoTest {
        java.setSrcDirs(['src/openbaoTest/java'])
        resources.setSrcDirs(['src/openbaoTest/resources'])
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    asciidoctorExt
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    openbaoTestImplementation.extendsFrom testImplementation
    openbaoTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation libs.mybatis.starter
    implementation libs.sshd.core
    implementation libs.springdoc.ui
    implementation libs.jsoup
    // OpenBao Transit 클라이언트 (ADR-0006). BOM 이 spring-vault-core 4.0.3 을 고정한다.
    implementation platform(libs.spring.cloud.dependencies)
    implementation libs.spring.vault.core

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.restdocs.mockmvc
    testImplementation libs.archunit.junit5
    testImplementation libs.swagger.parser
    testImplementation libs.openapi.mockmvc
    testRuntimeOnly libs.jaxb.api
    asciidoctorExt libs.restdocs.asciidoctor

}

tasks.withType(JavaExec) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        // Windows 환경에서 경로가 너무 길어지는 현상 방지
        modularity.inferModulePath = true
    }
}

// 프로젝트 볼륨은 생성 파일 옆에 AppleDouble 메타데이터를 만들 수 있다.
// Java/Spring classpath 스캔 전에 해당 메타데이터 파일만 제거한다.
def removeAppleDoubleFiles = {
    java.nio.file.Files.walk(projectDir.toPath()).withCloseable { paths ->
        paths.filter { path -> path.fileName?.toString()?.startsWith('._') }
            .sorted(java.util.Comparator.reverseOrder())
            .forEach { path -> java.nio.file.Files.deleteIfExists(path) }
    }
}

tasks.withType(JavaCompile).configureEach {
    doLast { removeAppleDoubleFiles() }
}

tasks.withType(ProcessResources).configureEach {
    doLast { removeAppleDoubleFiles() }
}

tasks.withType(Test).configureEach {
    // 기본 힙에서는 OpenAPI 계약 파싱 중 GC 가 시간을 대부분 잡아먹는다.
    maxHeapSize = '2g'
    doFirst { removeAppleDoubleFiles() }
}

def snippetsDir = file('build/generated-snippets')

tasks.named('test') {
    useJUnitPlatform()
    outputs.dir snippetsDir
}

tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.test
    maxParallelForks = 1
}

// 실 OpenBao 대상. BAO_ADDR·BAO_TOKEN 이 없으면 테스트가 스스로 건너뛴다. check 에 넣지 않는다.
tasks.register('openbaoTest', Test) {
    description = 'Runs tests against a real OpenBao (BAO_ADDR, BAO_TOKEN).'
    group = 'verification'
    testClassesDirs = sourceSets.openbaoTest.output.classesDirs
    classpath = sourceSets.openbaoTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.test
    // 환경변수는 태스크 입력이 아니라서 UP-TO-DATE 로 건너뛰는 것을 막는다. 실 서버 대상이라 매번 돈다.
    outputs.upToDateWhen { false }
}

tasks.named('asciidoctor') {
    configurations 'asciidoctorExt'
    inputs.dir snippetsDir
    dependsOn tasks.test
    baseDirFollowsSourceFile()
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.integrationTest
    dependsOn tasks.asciidoctor
    dependsOn tasks.jacocoTestReport
}
