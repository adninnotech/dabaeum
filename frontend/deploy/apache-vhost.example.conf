# 다배움 SPA + API reverse proxy (Apache VirtualHost)
# DocumentRoot 에 dist/spa/ 내용을 배포한 뒤 이 설정을 참고하세요.
#
# ProxyPass / ProxyRequests 오류가 나면 mod_proxy 미로드입니다.
#
# Debian/Ubuntu:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# RHEL/CentOS/Alma (httpd):
#   /etc/httpd/conf.modules.d/ 또는 httpd.conf 에서 주석 해제:
#     LoadModule proxy_module modules/mod_proxy.so
#     LoadModule proxy_http_module modules/mod_proxy_http.so
#     LoadModule rewrite_module modules/mod_rewrite.so
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# 확인:
#   apachectl -M | grep proxy

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName example.com
    DocumentRoot /www/default

    ErrorLog /error.log
    CustomLog /access.log combined

    # ---------- API reverse proxy ----------
    # /api/* → http://<api-host>:8080/api/*
    # (mod_proxy + mod_proxy_http 필요)
    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyPass        /api/ http://<api-host>:8080/api/
    ProxyPassReverse /api/ http://<api-host>:8080/api/

    <Directory /www/default>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA history 모드 (파일이 없을 때만 index.html)
        # ProxyPass /api/ 가 우선이므로 API는 여기로 안 떨어짐
        FallbackResource /index.html
    </Directory>
</VirtualHost>
