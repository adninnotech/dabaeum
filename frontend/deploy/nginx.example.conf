# 다배움 SPA + API reverse proxy 예시
# dist/spa 내용을 root 에 배포한 뒤 이 설정을 참고하세요.

server {
  listen 80;
  server_name example.com;

  root /var/www/dabaeum;
  index index.html;

  # SPA history 모드
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 정적 아이콘·파비콘 (dist/spa/icons, favicon.ico 함께 업로드)
  location /icons/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
  }

  # API — 브라우저 CORS/혼합콘텐츠 회피 (동일 출처 /api)
  location /api/ {
    proxy_pass http://<api-host>:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
