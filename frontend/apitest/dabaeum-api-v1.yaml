        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        evaluatedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        confirmedBy: {type: [string, 'null'], format: uuid}
        confirmedAt: {type: [string, 'null'], format: date-time}
        failureReason: {type: [string, 'null'], maxLength: 1000}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
