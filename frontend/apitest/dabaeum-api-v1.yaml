        중복 또는 잘못된 상태는 409 또는 422를 반환하며 Idempotency-Key는
        사용하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceAdjustmentRequest'}
      responses:
        '200': {$ref: '#/components/responses/AttendanceOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/attendance-summary:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      operationId: getAttendanceSummary
      tags: [Attendance]
      summary: 출결 요약 조회
      description: >-
        수강신청별 출결 요약을 조회합니다. ENROLLMENT_SUBJECT, 같은 기관의
        INSTITUTION_ADMIN 또는 과정에 배정된 INSTRUCTOR가 호출할 수 있습니다.
        조회 재시도는 안전하며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/AttendanceSummaryOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      operationId: getCompletion
      tags: [Completion]
      summary: 이수 상태 조회
      description: >-
        수강신청의 이수 상태를 조회합니다. ENROLLMENT_SUBJECT, 같은 기관의
        INSTITUTION_ADMIN 또는 과정에 배정된 INSTRUCTOR가 호출할 수 있습니다.
        조회 재시도는 안전하며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion/evaluate:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: evaluateCompletion
      tags: [Completion]
      summary: 이수 평가
      description: >-
        서버가 계산한 출결 지표로 이수를 평가합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN 또는 같은 과정·기관의 MAIN_INSTRUCTOR가 호출할 수
        있습니다. 기대 지표는 매번 서버에서 재검증하며 확정 전 재평가가
        가능합니다. Idempotency-Key는 사용하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletionEvaluationRequest'}
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion/confirm:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: confirmCompletion
      tags: [Completion]
      summary: 이수 확정
      description: >-
        ELIGIBLE 상태의 이수를 확정합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN 또는 같은 과정·기관의 MAIN_INSTRUCTOR가 호출할 수
        있습니다. 이미 확정된 이수를 다시 확정하면 409를 반환하며
        Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/contexts/lifelong-education/v1:
    get:
      operationId: getLifelongEducationContextV1
      tags: [VC Public]
      summary: 평생교육 VC JSON-LD Context 조회
      description: 다배움 평생교육 이수 VC의 custom term을 정의한 변경 불가능한 v1 Context입니다. 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: JSON-LD Context
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/VcContextDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/vocabulary/lifelong-education/v1:
    get:
      operationId: getLifelongEducationVocabularyV1
      tags: [VC Public]
      summary: 평생교육 VC 용어 문서 조회
      description: v1 Context에서 사용하는 용어 URL, 한글 설명과 값 형식을 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 평생교육 VC vocabulary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcVocabularyDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/issuers/{institutionId}:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    get:
      operationId: getCredentialIssuer
      tags: [VC Public]
      summary: Credential 발급기관 공개키 조회
      description: 기관이 발급한 VC의 JOSE kid가 가리키는 W3C Controlled Identifier 문서와 Ed25519 public JWK를 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 기관 Controlled Identifier 문서
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/CredentialIssuerDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/status/{credentialNo}:
    parameters:
      - name: credentialNo
        in: path
        required: true
        description: 공개 검증할 Credential 번호입니다.
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'}
    get:
      operationId: getPublicCredentialStatus
      tags: [VC Public]
      summary: Credential 공개 상태 조회
      description: 실제 fabric 프로필에서 DB·서명·저장 hash·Fabric 원장 상태를 검증하고 최소 상태 정보만 반환합니다. 인증 없이 호출할 수 있으며 실제 원장 검증 서비스가 없으면 503을 반환합니다.
      security: []
      responses:
        '200':
          description: 공개 Credential 상태
          headers:
            Cache-Control:
              description: 상태 응답 캐시를 금지합니다.
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicCredentialStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /completions/{completionId}/credentials:
    parameters:
      - {$ref: '#/components/parameters/CompletionId'}
    post:
      operationId: issueCredential
      tags: [Credential]
      summary: Credential 발급 요청
      description: PLATFORM_ADMIN 또는 해당 과정 기관의 INSTITUTION_ADMIN이 확정 이수를 Credential 발급 대기 상태로 요청합니다. 202 응답 후 상세 조회 API로 PENDING·ISSUING·ISSUED·FAILED 상태를 polling합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialIssueRequest'}
      responses:
        '202': {$ref: '#/components/responses/CredentialAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    get:
      operationId: getCredential
      tags: [Credential]
      summary: Credential 상세 조회
      description: 본인, 해당 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 Credential 발급 상태와 메타데이터를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/CredentialOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/document:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    get:
      operationId: downloadCredentialDocument
      tags: [Credential]
      summary: 서명된 VC 문서 다운로드
      description: 본인, 해당 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 저장 hash와 서명을 검증한 Compact JWS를 다운로드합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: RFC 7515 Compact JWS 형식의 W3C VC
          headers:
            Content-Disposition:
              description: Credential 번호 기반 다운로드 파일명입니다.
              schema: {type: string}
            Cache-Control:
              description: VC 원문 캐시를 금지합니다.
              schema: {type: string, const: no-store}
          content:
            application/vc+jwt:
              schema: {type: string, description: Compact JWS}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/credentials:
    get:
      operationId: listCurrentUserCredentials
      tags: [Credential]
      summary: 내 Credential 목록 조회
      description: 인증된 사용자가 자신의 Credential 목록을 조회합니다. userId는 요청 경로 또는 query로 받지 않으며 인증 컨텍스트에서 결정합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/CredentialPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/credentials:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserCredentials
      tags: [Credential]
      summary: 사용자 Credential 목록 조회
      description: 본인, 해당 사용자 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 사용자 Credential 목록을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/CredentialPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/revoke:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    post:
      operationId: revokeCredential
      tags: [Credential]
      summary: Credential 폐기
      description: PLATFORM_ADMIN 또는 해당 과정 기관의 INSTITUTION_ADMIN이 발급된 Credential 폐기를 요청합니다. 202 응답 후 상세 조회 API로 상태를 polling합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialRevokeRequest'}
      responses:
        '202': {$ref: '#/components/responses/CredentialAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/reissue:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    post:
      operationId: reissueCredential
      tags: [Credential]
      summary: Credential 재발급
      description: PLATFORM_ADMIN 또는 해당 과정 기관의 INSTITUTION_ADMIN이 기존 Credential을 대체하는 재발급을 요청합니다. 202 응답 후 상세 조회 API로 상태를 polling합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialReissueRequest'}
      responses:
        '202': {$ref: '#/components/responses/CredentialAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/verify:
    post:
      operationId: verifyCredential
      tags: [Credential]
      summary: Credential 검증
      description: 인증 없이 credentialNo 또는 credentialHash 중 정확히 하나를 제공해 유효성을 공개 검증합니다. raw VC/proof는 받지 않으며 공개 감사 requesterType은 INDIVIDUAL로 기록합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialVerifyRequest'}
      responses:
        '200': {$ref: '#/components/responses/CredentialVerificationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/verifications:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    get:
      operationId: listCredentialVerifications
      tags: [Credential]
      summary: Credential 검증 이력 조회
      description: 본인, 해당 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 Credential 검증 이력을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/CredentialVerificationPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/badges:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    post:
      operationId: issueLearningBadge
      tags: [Badge]
      summary: 학습 Badge 발급 요청
      description: 향후 구현 예정 / 현재 미구현. 확정된 이수 정보를 기반으로 학습 Badge 발급을 요청하는 향후 계약입니다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BadgeIssueRequest'}
      responses:
        '202': {$ref: '#/components/responses/LearningBadgeAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/badges:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserBadges
      tags: [Badge]
      summary: 사용자 Badge 목록 조회
      description: 향후 구현 예정 / 현재 미구현. 사용자에게 발급된 학습 Badge 목록을 조회하는 향후 계약입니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/LearningBadgePageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /badges/{badgeId}:
    parameters:
      - {$ref: '#/components/parameters/BadgeId'}
    get:
      operationId: getLearningBadge
      tags: [Badge]
      summary: 학습 Badge 상세 조회
      description: 향후 구현 예정 / 현재 미구현. Badge 식별자로 발급 상태와 메타데이터를 조회하는 향후 계약입니다.
      responses:
        '200': {$ref: '#/components/responses/LearningBadgeOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호입니다.
      schema: {type: integer, format: int32, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: 한 페이지에 반환할 항목 수입니다. 1에서 100 사이이며 기본값은 20입니다.
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
    Sort:
      name: sort
      in: query
      description: 정렬 기준을 field,direction 형식으로 지정합니다.
      schema: {type: string}
      example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일한 상태 변경 요청의 중복 처리를 방지하는 요청 키입니다.
      schema: {type: string, minLength: 8, maxLength: 128}
    InstitutionId:
      name: institutionId
      in: path
      required: true
      description: 기관 식별자입니다.
      schema: {type: string, format: uuid}
    InstructorApplicationId:
      name: applicationId
      in: path
      required: true
      description: 강사 신청 식별자입니다.
      schema: {type: string, format: uuid}
    CourseId:
      name: courseId
      in: path
      required: true
      description: 과정 식별자입니다.
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 과정 회차 식별자입니다.
      schema: {type: string, format: uuid}
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      description: 수강신청 식별자입니다.
      schema: {type: string, format: uuid}
    AttendanceId:
      name: attendanceId
      in: path
      required: true
