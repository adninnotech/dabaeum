        keyVersion: {type: integer, minimum: 0, description: COMPROMISE 만. 유출 선언할 버전}
        compromisedAt: {type: string, format: date-time, description: COMPROMISE 만. 승인하는 사고 시각}
        reason: {type: string, maxLength: 1000}
