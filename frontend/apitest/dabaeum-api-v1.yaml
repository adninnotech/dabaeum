            강좌 상태별 분해. CourseStatus 의 RECRUITING·IN_PROGRESS·COMPLETED 를 그대로
            센 값이다. DRAFT·RECRUITMENT_CLOSED·CANCELLED 는 어느 값에도 들어가지 않으므로
