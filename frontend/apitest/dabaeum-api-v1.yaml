        score: {type: [number, 'null'], minimum: 0, maximum: 1, description: MODEL_SCORE 일 때 신청 확률}
        topFactor: {type: [string, 'null'], enum: [CLASSIFICATION, REGION, AGE_BAND, PRICE, SCHEDULE, POPULARITY, null], description: MODEL_SCORE 일 때 가장 크게 기여한 속성 묶음}
