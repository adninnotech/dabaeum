         institutionName]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        status:
          type: string
          enum: [APPLIED, WAITLISTED, APPROVED, REJECTED, CANCELLED, WITHDRAWN]
        appliedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        courseTitle: {type: string, maxLength: 200}
        userName: {type: string, maxLength: 100}
        institutionName: {type: string, maxLength: 200}
        progressPercent:
          type: integer
          description: >-
            출석(PRESENT·LATE) 대비 진행률(%). 강좌별 목록(Enrollment.progressPercent)과
            같은 계산식이라 두 화면이 같은 숫자를 보인다. 현재 정의상 출석률과 값이 같은데,
            회차에 온라인 축이 생기면 출석 + 영상 시청의 합성으로 확장될 자리다.
        lastStudiedAt:
          type: [string, 'null']
          format: date-time
          description: 마지막 출석(PRESENT·LATE) 시각. 출결이 없으면 null.
