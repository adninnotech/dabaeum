openapi: 3.1.0
info:
  title: Dabaeum API
  version: 1.0.0
  description: >-
    프론트엔드 연동을 위한 버전 관리 API 계약입니다. 각 operation은 기능별 tag로
    분류되며 구현이 완료된 API만 Try it out으로 호출할 수 있습니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: 시스템 상태 확인 API
  - name: Institution
    description: 기관 생성·조회·수정 API
  - name: SigningKey
    description: 기관 서명키 관리 API
  - name: Auth
    description: 개발용 LOCAL 회원가입·로그인과 인증 세션 API
  - name: User
    description: 사용자 계정·프로필·상태 API
  - name: Identity & Role
    description: 사용자 identity와 역할 범위 API
  - name: Instructor
    description: 기관 강사 신청·심사와 과정별 강사 배정 API
  - name: Course
    description: 교육 과정 API
  - name: Course Session
    description: 과정 회차와 일정 API
  - name: Course Attachment
    description: 과정 첨부파일 연결 API
  - name: Enrollment
    description: 수강신청과 승인 상태 API
  - name: Attendance
    description: QR 출결·출결 보정·요약 API
  - name: Completion
    description: 이수 평가와 확정 API
  - name: Credential
    description: Credential 발급·조회·검증 API
  - name: VC Public
    description: W3C VC Context·용어·기관 공개키·상태 공개 API
  - name: Badge
    description: 학습 Badge 발급·조회 API
  - name: Support
    description: 공지·FAQ·약관·공통코드 API
  - name: Inquiry
    description: 문의 등록·답변 API
  - name: Review
    description: 수강평 API
  - name: Interest
    description: 관심 강좌 API
  - name: Notification
    description: 알림 API
  - name: File
    description: 파일 업로드·조회 API
  - name: Admin
    description: 관리자 계정·접속기록 관리 API (플랫폼 관리자 전용)
  - name: Cms
    description: 사이트 메뉴·콘텐츠 페이지 API (공개 조회, 관리는 플랫폼 관리자)
  - name: PublicCourse
    description: 공공데이터 평생학습강좌 API (대구 지역 외부 강좌 조회, 수집은 플랫폼 관리자)
paths:
  /system/ping:
    get:
      operationId: getSystemPing
      tags: [System]
      summary: 시스템 상태 확인
      description: 서비스가 요청을 처리할 수 있는지 확인합니다. 인증 없이 호출할 수 있습니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/SystemPingOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions:
    get:
      operationId: listInstitutions
      tags: [Institution]
      summary: 기관 목록 조회
      description: 기관 목록을 페이지 단위로 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 기관명·대표자명·연락처 부분일치 검색. 연락처는 하이픈을 무시한다.
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, INACTIVE, SUSPENDED]}
        - name: region
          in: query
          required: false
          schema: {type: string, maxLength: 50}
          description: 지역 정확 일치 필터입니다.
      responses:
        '200': {$ref: '#/components/responses/InstitutionPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createInstitution
      tags: [Institution]
      summary: 기관 생성
      description: 새 기관을 생성합니다. 플랫폼 관리자 권한이 필요합니다. 커밋 뒤 기관 서명키(수료증용·Status List 용)를 워커가 비동기로 만듭니다(local·dev 프로필, provider=openbao). 결과는 getInstitutionSigningKeys 로 확인합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstitutionCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/InstitutionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    get:
      operationId: getInstitution
      tags: [Institution]
      summary: 기관 상세 조회
      description: 기관 식별자로 기관 상세 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/InstitutionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateInstitution
      tags: [Institution]
      summary: 기관 수정
      description: >-
        플랫폼 관리자는 기관의 전체 정보를 수정할 수 있습니다. 기관 관리자는 자기 기관의 연락처,
        소개(introduction), 로고만 수정할 수 있으며 이름·기관 코드 등은 수정할 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstitutionUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/InstitutionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/signing-keys:
    get:
      operationId: getInstitutionSigningKeys
      tags: [SigningKey]
      summary: 기관 서명키 조회
      description: 기관의 서명키 마스터·버전 이력·진행 중 작업·미사용 승인을 조회합니다. 플랫폼 관리자 권한이 필요합니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createInstitutionSigningKeys
      tags: [SigningKey]
      summary: 기관 서명키 생성
      description: 수료증용·Status List 용 Transit 키를 만들고 재조회로 설정을 검증한 뒤 활성화합니다. OpenBao 호출 결과가 불확실하면 작업을 UNCONFIRMED 로 남기고 503 을 냅니다(details 에 operationId). 기관 승인·생성 때 워커가 자동으로 만들며, 이 API 는 자동 생성이 멈췄을 때(키 없음·ERROR) 다시 만드는 데 씁니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/SigningKeyOverviewCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /institutions/{institutionId}/signing-keys/approvals:
    post:
      operationId: createSigningKeyApproval
      tags: [SigningKey]
      summary: 서명키 작업 승인 기록 생성
      description: 승인자의 세션으로 회전·재개·폐지·유출 선언 승인을 만듭니다. 대상 마스터·현재 버전·실행 파라미터가 고정되며 24시간 뒤 만료됩니다. 실행 요청은 같은 idempotencyKey 를 보내야 합니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyApprovalRequest'}
      responses:
        '201': {$ref: '#/components/responses/SigningKeyApprovalCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/signing-keys/{purpose}/rotate:
    post:
      operationId: rotateSigningKey
      tags: [SigningKey]
      summary: 서명키 회전
      description: 승인을 원자 소비하고 작업을 기록한 뒤 Transit 키를 회전합니다. 새 버전이 공개되고 이전 버전은 검증에만 쓰입니다. 결과가 불확실하면 작업을 UNCONFIRMED 로 남기고 503 을 냅니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
        - name: purpose
          in: path
          required: true
          schema: {type: string, enum: [credential, status-list]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyRotateRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /institutions/{institutionId}/signing-keys/{purpose}/compromise:
    post:
      operationId: compromiseSigningKey
      tags: [SigningKey]
      summary: 서명키 버전 유출 선언
      description: 승인을 원자 소비하고 대상 버전을 COMPROMISED 로 기록합니다(즉시 동작, 한 트랜잭션). 대상이 현재 버전이고 키가 ACTIVE 면 같은 요청에서 후속 회전을 이어갑니다. 진행 중 작업이 있으면 즉시 동작만 커밋하고 후속 회전은 작업 사유에 deferred 로 남깁니다. 후속 회전 결과가 불확실하면 작업을 UNCONFIRMED 로 남기고 503 을 냅니다(유출 선언은 유지됩니다).
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
        - name: purpose
          in: path
          required: true
          schema: {type: string, enum: [credential, status-list]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyCompromiseRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /institutions/{institutionId}/signing-keys/{purpose}/adjudicate:
    post:
      operationId: adjudicateSigningKeyOperation
      tags: [SigningKey]
      summary: 진행 중 작업 운영자 판정
      description: PREPARED·UNCONFIRMED·RECORDED 로 남은 작업을 운영자가 확정합니다. RECORDED 는 OpenBao 재조회로 결과를 확인한 뒤 T2 이후를 이어가고(회전·유출 후속·생성), FAILED 는 작업을 닫아 같은 키의 새 작업을 허용합니다. RECORDED 작업은 FAILED 로 바꿀 수 없습니다. 승인 기록 없이 PLATFORM_ADMIN 단독이며 판정 근거(evidence)가 필수입니다. 다른 프로세스의 lease 가 살아 있으면 409 이며 만료 뒤 다시 시도합니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
        - name: purpose
          in: path
          required: true
          schema: {type: string, enum: [credential, status-list]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyAdjudicateRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /institutions/{institutionId}/signing-keys/credential/suspend:
    post:
      operationId: suspendCredentialSigningKey
      tags: [SigningKey]
      summary: 수료증 서명 정지
      description: 수료증 키의 신규 서명을 정지합니다. 승인이 필요 없습니다. 과거 발급분 검증과 Status List 갱신은 계속됩니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeySuspendRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/signing-keys/credential/resume:
    post:
      operationId: resumeCredentialSigningKey
      tags: [SigningKey]
      summary: 수료증 서명 재개
      description: 정지된 수료증 키를 승인 기록으로 재개합니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyResumeRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/signing-keys/credential/revoke:
    post:
      operationId: revokeCredentialSigningKey
      tags: [SigningKey]
      summary: 기관 폐지(수료증 서명 종료)
      description: 기관 폐지로 수료증 키의 발급 권한을 종료합니다. 키 자료는 계속 신뢰되어 과거 발급분 검증과 발급자 문서 공개는 유지되고, Status List 키는 계속 쓰입니다.
      parameters:
        - {$ref: '#/components/parameters/InstitutionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SigningKeyRevokeRequest'}
      responses:
        '200': {$ref: '#/components/responses/SigningKeyOverviewOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/instructor-applications:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    post:
      operationId: applyInstructor
      tags: [Instructor]
      summary: 기관 강사 신청
      description: >-
        전역 LEARNER 사용자가 선택한 기관의 강사로 신청합니다. 신청자 ID는
        인증 정보에서 가져오며 요청 본문으로 지정할 수 없습니다. 같은 기관에
        처리 중인 신청이나 이미 부여된 기관 강사 역할이 있으면 409를 반환합니다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstructorApplicationRequest'}
      responses:
        '201': {$ref: '#/components/responses/InstructorApplicationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      operationId: listInstitutionInstructorApplications
      tags: [Instructor]
      summary: 기관 강사 신청 목록 조회
      description: 같은 기관의 기관 관리자 또는 플랫폼 관리자가 강사 신청을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          description: 신청 처리 상태 필터입니다.
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/me:
    get:
      operationId: listMyInstructorApplications
      tags: [Instructor]
      summary: 내 강사 신청 목록 조회
      description: 인증 사용자가 본인의 기관별 강사 신청 이력을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          description: 신청 처리 상태 필터입니다.
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    get:
      operationId: getInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 상세 조회
      description: 신청자 본인, 같은 기관 관리자 또는 플랫폼 관리자가 신청 상세를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}/approve:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    post:
      operationId: approveInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 승인
      description: >-
        같은 기관의 기관 관리자 또는 플랫폼 관리자가 대기 신청을 승인하고 해당
        기관 범위 INSTRUCTOR 역할을 부여합니다. 기존 전역 LEARNER 역할은 유지됩니다.
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}/reject:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    post:
      operationId: rejectInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 거절
      description: 같은 기관의 기관 관리자 또는 플랫폼 관리자가 거절 사유와 함께 대기 신청을 거절합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstructorApplicationRejectRequest'}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users:
    get:
      operationId: listUsers
      tags: [User]
      summary: 사용자 목록 조회
      description: >-
        사용자 목록을 상태와 페이지 조건으로 조회합니다. 모든 필터는 선택이며 AND 로 결합되고,
        page.totalElements 에도 같은 조건이 적용됩니다(요약 카드는 size=1 로 합계만 읽을 수 있습니다).
        sort 필드는 createdAt·updatedAt·name·email·status·lastLoginAt·enrollmentCount 이고
        방향은 asc·desc 입니다. lastLoginAt 정렬에서 접속 기록이 없는 사용자는 방향과 관계없이 맨 뒤에 옵니다.
        형식이 틀린 값, 없는 구·군 코드, createdFrom 이 createdTo 보다 늦은 경우는 400 입니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}
        - name: role
          in: query
          required: false
          schema: {type: string, enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]}
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 이름·이메일·연락처 부분일치 검색. 연락처는 하이픈을 무시한다.
        - name: region
          in: query
          required: false
          schema: {type: string, maxLength: 50}
          description: 지역 정확 일치 필터입니다.
        - name: regionCode
          in: query
          required: false
          schema: {type: string, enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']}
          description: 구·군 코드 정확 일치(GET /regions 의 code).
        - name: gender
          in: query
          required: false
          schema: {type: string, enum: [MALE, FEMALE, UNDISCLOSED]}
          description: 성별. UNDISCLOSED 는 '밝히지 않음'을 고른 사용자이며, 성별을 입력하지 않은 사용자는 어느 값에도 잡히지 않습니다.
        - name: hasEnrollment
          in: query
          required: false
          schema: {type: boolean}
          description: true 는 승인된 수강 1건 이상, false 는 0건. 목록의 enrollmentCount 와 같은 기준입니다.
        - name: lastLogin
          in: query
          required: false
          schema: {type: string, enum: [WITHIN_7, WITHIN_30, OVER_90, NEVER]}
          description: >-
            최근 접속(요청 시각 기준). WITHIN_7·WITHIN_30 은 최근 7·30일 안, OVER_90 은 마지막 접속이
            90일보다 전(접속 기록이 없는 사용자 제외), NEVER 는 접속 기록이 없는 사용자입니다.
        - name: createdFrom
          in: query
          required: false
          schema: {type: string, format: date}
          description: 가입일 시작(서울 날짜, 포함).
        - name: createdTo
          in: query
          required: false
          schema: {type: string, format: date}
          description: 가입일 끝(서울 날짜, 포함).
      responses:
        '200': {$ref: '#/components/responses/UserPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createUser
      tags: [User]
      summary: 사용자 생성
      description: 새 사용자 계정을 생성합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/signup:
    post:
      operationId: signupLocalAccount
      tags: [Auth]
      summary: 일반 사용자 회원가입
      description: >-
        local/dev 환경에서 기관 선택 없이 일반 사용자를 가입시킵니다. 가입자는
        institutionId가 없는 전역 LEARNER 역할을 받아 여러 기관 과정에 본인
        수강신청할 수 있습니다. 운영 LOCAL 인증 활성화는 별도 범위입니다.
        구·군과 이용약관·개인정보 동의가 필수이며, 가입과 동시에 평생학번이
        발급됩니다(GET /users/me 의 learnerNo). 평생학번 일련번호가 소진되면 503 입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignupRequest'}
      responses:
        '201': {$ref: '#/components/responses/LocalAccountCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/login:
    post:
      operationId: loginLocalAccount
      tags: [Auth]
      summary: 일반 사용자 로그인
      description: >-
        local/dev 환경에서 이메일과 비밀번호를 확인하고 Access Token을 발급합니다.
        이후 요청의 Authorization 헤더에 Bearer {accessToken} 형식으로 전달합니다.
        계정·비밀번호·사용자 상태 오류는 모두 같은 401 응답으로 반환합니다.
        같은 계정으로 5회 연속 비밀번호가 틀리면 30분 동안 잠기며, 5번째 실패와 잠긴 동안의 시도는
        401 `ACCOUNT_LOCKED` 로 응답합니다(비밀번호가 맞아도). 로그인에 성공하거나 비밀번호를 재설정하면
        실패 횟수가 초기화되고, 관리자 비밀번호 초기화도 잠금을 풉니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/LocalAccountOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/dadaegu/config:
    get:
      operationId: getDadaeguLoginConfig
      tags: [Auth]
      summary: 다대구 QR 로그인 설정 조회
      description: >-
        다대구(대구체인) QR 로그인 SDK(DIDLogin.loginPersonal)에 전달할 siteId를
        조회합니다. siteId는 QR 팝업 URL에도 노출되는 공개 식별자이며 인증 없이
        호출합니다. local/dev 환경 전용입니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/DadaeguConfigOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/dadaegu/login:
    post:
      operationId: loginWithDadaegu
      tags: [Auth]
      summary: 다대구 DID QR 로그인
      description: >-
        다대구 앱 QR 인증 콜백이 프론트에 전달한 암호문 필드(did·name·birthdate·
        phoneNumber)를 변형 없이 그대로 받아 서버가 세션키+RSA로 복호화합니다
        (requiredVC=Name:PhoneNum:Birthdate, ci·gender·isForeigner는 무시).
        항상 200 이며 data.registrationRequired 로 분기합니다. 기존 사용자는 AuthToken
        필드와 registrationRequired=false 를 받고, 이름·전화·생년월일 중 변경된 값만
        갱신됩니다. 처음 보는 DID 는 계정을 만들지 않고 registrationRequired=true 와
        1회용 registrationToken(10분)을 받습니다 — 프론트는 maskedName 을 보여주고
        구·군(GET /regions)·약관을 받아 POST /auth/dadaegu/signup 을 부릅니다. 이름
        클레임이 없거나 복호화 실패·비활성 사용자는 모두 같은 401 응답입니다.
        local/dev 환경 전용입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DadaeguLoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/DadaeguLoginOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/dadaegu/signup:
    post:
      operationId: signupWithDadaegu
      tags: [Auth]
      summary: 다대구 첫 로그인 가입 완료
      description: >-
        다대구 첫 로그인에서 받은 registrationToken 과 구·군·약관 동의로 계정을 만들고
        평생학번을 발급합니다. 전역 LEARNER 역할을 받습니다. 토큰은 1회용이며 만료·재사용·
        위조는 모두 같은 401 입니다. 그 사이 같은 DID 로 가입이 끝났으면 409, 평생학번
        일련번호가 소진되면 503 입니다. local/dev 환경 전용입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DadaeguSignupRequest'}
      responses:
        '201': {$ref: '#/components/responses/LocalAccountCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [Auth]
      summary: 현재 인증 세션 조회
      description: >-
        현재 bearer token으로 인증된 사용자와 역할을 조회합니다. passwordExpired 로 관리자 비밀번호 변경 안내 여부를
        판단합니다.
      responses:
        '200': {$ref: '#/components/responses/SessionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [User]
      summary: 내 사용자 정보 조회
      description: 현재 로그인 사용자의 공개 프로필을 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateCurrentUser
      tags: [User]
      summary: 내 사용자 정보 수정
      description: 현재 로그인 사용자의 수정 가능한 프로필을 변경합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserMeUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: getUser
      tags: [User]
      summary: 사용자 상세 조회
      description: 사용자 식별자로 사용자 공개 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateUser
      tags: [User]
      summary: 사용자 수정
      description: 관리자가 사용자 프로필 정보를 수정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/status:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      operationId: changeUserStatus
      tags: [User]
      summary: 사용자 상태 변경
      description: 사용자의 활성·휴면·정지·탈퇴 상태를 변경합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserStatusChangeRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/memo:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      operationId: updateUserAdminMemo
      tags: [User]
      summary: 회원 관리자 메모 변경
      description: B-4 회원 상세의 사이트 전역 관리자 메모를 남기거나 지웁니다. memo가 null이면 지웁니다. 기관별 강사 메모(updateInstitutionInstructorMemo)와는 별개입니다. 본문을 생략하면 메모를 지웁니다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserMemoUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/withdraw:
    post:
      operationId: withdrawCurrentUser
      tags: [User]
      summary: 본인 회원 탈퇴
      description: 현재 로그인 사용자가 스스로 탈퇴합니다. 상태를 WITHDRAWN으로 바꾸고 발급된 토큰을 즉시 무효화합니다. 수강·수강평 등 이력은 지우지 않습니다. 이미 탈퇴한 사용자는 409를 반환합니다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/notification-preferences:
    put:
      operationId: updateNotificationPreferences
      tags: [User]
      summary: 내 알림 수신 설정 변경
      description: 현재 로그인 사용자의 이메일·SMS 알림 수신 여부를 변경합니다. 보내지 않은 항목은 기존 설정을 그대로 둡니다. 두 항목을 모두 보내지 않으면 422를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPreferenceUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/identities:
    get:
      operationId: listMyIdentities
      tags: [Identity & Role]
      summary: 내 identity 목록 조회
      description: >-
        호출자 본인에 연결된 공개 identity 목록을 조회합니다. 마이페이지의 휴대폰
        "인증됨" 표시가 이 경로를 씁니다. 응답 형태는 /users/{userId}/identities 와
        같고, 원본 provider subject 와 비밀 키는 반환하지 않습니다.

        이 경로는 반드시 /users/{userId}/identities 보다 앞에 있어야 합니다 —
        시큐리티 규칙과 라우팅 모두 먼저 맞는 것이 이기고, 와일드카드가 리터럴 me 를
        삼키면 UUID 변환에서 400 이 납니다.
      responses:
        '200': {$ref: '#/components/responses/IdentityListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/identities:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserIdentities
      tags: [Identity & Role]
      summary: 사용자 identity 목록 조회
      description: 사용자에 연결된 공개 identity 목록을 조회합니다. 원본 provider subject와 비밀 키는 반환하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/IdentityListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: linkUserIdentity
      tags: [Identity & Role]
      summary: 사용자 identity 연결
      description: 외부 인증 provider identity를 사용자 계정에 연결합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityLinkRequest'}
      responses:
        '201': {$ref: '#/components/responses/IdentityCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/identities/{identityId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
      - name: identityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: unlinkUserIdentity
      tags: [Identity & Role]
      summary: 사용자 identity 연결 해제
      description: 사용자 계정에 연결된 identity를 해제합니다.
      responses:
        '200': {$ref: '#/components/responses/IdentityOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/identities/dadaegu:
    post:
      operationId: linkMyDadaeguIdentity
      tags: [Identity & Role]
      summary: 내 계정에 다대구 DID 연결 (일반회원 → 통합)
      description: >-
        로그인된 사용자에게 다대구 DID 를 붙입니다. 요청 본문은 다대구 QR 로그인과 같은
        암호문 필드이며 서버가 복호화합니다. 이름·전화·생년월일은 다대구 본인인증 값으로
        덮어씁니다(이메일 유지). 그 DID 가 이미 다른 계정에 묶여 있거나 이 계정에 이미
        DADAEGU identity 가 있으면 409 IDENTITY_CONFLICT 입니다. 계정 병합은 지원하지
        않습니다. 복호화 실패는 401. local/dev 환경 전용입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DadaeguLoginRequest'}
      responses:
        '201': {$ref: '#/components/responses/IdentityCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/identities/local:
    post:
      operationId: linkMyLocalIdentity
      tags: [Identity & Role]
      summary: 내 계정에 이메일·비밀번호 연결 (다대구 → 통합)
      description: >-
        로그인된 사용자(대개 다대구 QR 로 가입한 사용자)에게 LOCAL 로그인 수단을
        붙입니다. 이메일·비밀번호 규칙은 회원가입과 같고, tb_users.email 도 함께
        저장합니다. 이 계정에 이미 LOCAL identity 가 있거나 그 이메일이 다른 계정에
        있으면 409 IDENTITY_CONFLICT 입니다. 이후 이메일 로그인과 QR 로그인 모두 같은
        사용자로 인증됩니다. local/dev 환경 전용입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalIdentityLinkRequest'}
      responses:
        '201': {$ref: '#/components/responses/IdentityCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/institutions:
    get:
      operationId: listMyInstitutions
      tags: [Identity & Role]
      summary: 내 소속 기관 목록 조회
      description: >-
        로그인한 사용자가 INSTRUCTOR 또는 INSTITUTION_ADMIN 으로 소속된 기관 목록을
        조회합니다. institutionId 가 없는 전역 역할(PLATFORM_ADMIN)은 나오지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/MyInstitutionListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/roles:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserRoles
      tags: [Identity & Role]
      summary: 사용자 역할 목록 조회
      description: 사용자에게 부여된 역할과 기관 범위를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/RoleListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: assignUserRole
      tags: [Identity & Role]
      summary: 사용자 역할 부여
      description: 사용자에게 기관 범위 역할을 부여합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleAssignmentRequest'}
      responses:
        '201': {$ref: '#/components/responses/RoleCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/roles/{roleId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
      - name: roleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: revokeUserRole
      tags: [Identity & Role]
      summary: 사용자 역할 회수
      description: 사용자에게 부여된 역할을 회수합니다.
      responses:
        '200': {$ref: '#/components/responses/RoleOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses:
    get:
      operationId: listCourses
      tags: [Course]
      summary: 과정 목록 조회
      description: >-
        과정 목록을 상태와 페이지 조건으로 조회합니다. DRAFT 는 PLATFORM_ADMIN 에게는 전부, 그
        기관 소속 INSTITUTION_ADMIN·INSTRUCTOR 에게는 자기 기관 것만 나옵니다. 그 밖의 사용자에게는
        status=DRAFT 를 명시해도 나오지 않습니다. 강좌 찾기 화면용이라 로그인 없이 호출할 수 있으며,
        그때는 학습자와 같이 DRAFT 가 나오지 않습니다.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 강의명·기관명·강사명 부분일치 검색. 대소문자를 구분하지 않는다.
        - name: educationType
          in: query
          required: false
          schema: {type: string, enum: [OFFLINE, ONLINE, HYBRID]}
        - name: selectionMethod
          in: query
          required: false
          schema: {type: string, enum: [FCFS, LOTTERY]}
        - name: classificationCode
          in: query
          required: false
          schema: {type: string, pattern: '^TSIX_[0-9]{6}$'}
          description: 표준 분류 코드. 어느 단계든 하위 분류를 포함해 거른다(TSIX_040000 이면 문화예술교육 전체).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, RECRUITING, RECRUITMENT_CLOSED, IN_PROGRESS, COMPLETED, CANCELLED]
      responses:
        '200': {$ref: '#/components/responses/CoursePageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createCourse
      tags: [Course]
      summary: 과정 생성
      description: 기관의 새 교육 과정을 생성합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/CourseCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    get:
      operationId: getCourse
      tags: [Course]
      summary: 과정 상세 조회
      description: >-
        과정 식별자로 과정 상세 정보를 조회합니다. DRAFT 는 그 강좌를 관리하는 사용자(PLATFORM_ADMIN,
        그 기관 소속 INSTITUTION_ADMIN·INSTRUCTOR)에게만 열리고, 그 밖의 사용자에게는 존재를
        알리지 않기 위해 404 를 반환합니다. 로그인 없이 호출할 수 있으며, 그때는 DRAFT 가 404 입니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/CourseOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateCourse
      tags: [Course]
      summary: 과정 수정
      description: >-
        모집 전 과정의 기본 정보를 수정합니다. status 를 CANCELLED 로 바꾸면(COMPLETED·CANCELLED 가 아닌
        어느 상태에서든 가능) 같은 트랜잭션에서 그 과정의 살아 있는 수강이 정리됩니다 — 승인(APPROVED)은
        WITHDRAWN, 신청·대기(APPLIED·WAITLISTED)는 cancellationReason "과정 취소" 의 CANCELLED 가 됩니다.
        이수 판정(평가·확정)이 있는 수강은 그대로 둡니다. 학습자 알림은 알림 생성 기능이 생기면 붙습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteDraftCourse
      tags: [Course]
      summary: 임시저장 과정 삭제
      description: >-
        임시저장(DRAFT) 과정을 지웁니다. 게시된 적이 없어 수강·출결·수료가 붙지 않은 과정만 대상이며,
        행은 삭제 시각만 남기고(soft delete) 목록·상세·검색에서 사라집니다. 권한은 과정 수정과 같습니다
        (PLATFORM_ADMIN, 그 기관 INSTITUTION_ADMIN, 그 과정의 MAIN 강사). DRAFT 가 아니면
        409 COURSE_STATUS_CONFLICT, 없거나 이미 지운 과정은 404 COURSE_NOT_FOUND 입니다.
      responses:
        '200': {$ref: '#/components/responses/DeletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/publish:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    post:
      operationId: publishCourse
      tags: [Course]
      summary: 과정 모집 공개
      description: 과정을 모집 가능한 상태로 전환합니다.
      responses:
        '200': {$ref: '#/components/responses/CourseOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/close:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    post:
      operationId: closeCourse
      tags: [Course]
      summary: 과정 모집 종료
      description: 과정의 모집을 종료하고 상태를 전환합니다.
      responses:
        '200': {$ref: '#/components/responses/CourseOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/reopen:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    post:
      operationId: reopenCourse
      tags: [Course]
      summary: 과정 모집 재개 (관리자 정정)
      description: >-
        잘못 마감한 모집을 다시 엽니다. PLATFORM_ADMIN만 호출할 수 있고 사유가 필수이며
        정정 이력이 남습니다. RECRUITMENT_CLOSED·IN_PROGRESS 에서만 가능하고 종료·취소된
        과정은 409 CORRECTION_NOT_ALLOWED 입니다. Idempotency-Key는 사용하지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectionReasonRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/instructors:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    get:
      operationId: listCourseInstructors
      tags: [Instructor]
      summary: 과정 강사 목록 조회
      description: >-
        과정에 배정된 MAIN·ASSISTANT 강사 목록을 조회합니다. 강좌 상세 화면용이라 로그인 없이
        호출할 수 있으며, 로그인하지 않은 요청에는 instructorEmail 이 null 입니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/CourseInstructorListOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: assignCourseInstructor
      tags: [Instructor]
      summary: 과정 강사 배정
      description: >-
        기관 관리자 또는 플랫폼 관리자가 같은 기관의 활성 INSTRUCTOR 사용자를
        MAIN 또는 ASSISTANT 강사로 배정합니다. MAIN 강사는 과정별 한 명만 허용됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseInstructorAssignRequest'}
      responses:
        '201': {$ref: '#/components/responses/CourseInstructorCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/instructors/{userId}:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
      - {$ref: '#/components/parameters/UserId'}
    put:
      operationId: updateCourseInstructor
      tags: [Instructor]
      summary: 과정 강사 역할 변경
      description: 기관 관리자 또는 플랫폼 관리자가 배정된 강사의 MAIN·ASSISTANT 역할을 변경합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseInstructorUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseInstructorOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: removeCourseInstructor
      tags: [Instructor]
      summary: 과정 강사 배정 해제
      description: >-
        기관 관리자 또는 플랫폼 관리자가 과정 강사 배정을 해제합니다. 기관
        INSTRUCTOR 역할 회수 전 모든 과정 배정을 먼저 해제해야 합니다.
      responses:
        '200': {$ref: '#/components/responses/CourseInstructorOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/attachments:
    parameters:
