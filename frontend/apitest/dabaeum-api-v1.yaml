        institutionId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
    RoleResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Role'}
