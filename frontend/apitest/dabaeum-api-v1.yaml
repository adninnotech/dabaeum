        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /public-courses:
    get:
      operationId: listPublicCourses
      tags: [PublicCourse]
      summary: 공공데이터 평생학습강좌 목록
      description: >-
        공공데이터포털 전국평생학습강좌표준데이터에서 받은 대구 지역 외부 강좌입니다. 다배움에서 신청할 수 없으며 신청은
        homepageUrl(운영기관 홈페이지)로 넘깁니다. 기본으로 교육이 끝나지 않은 강좌(서울 날짜 기준)만 나오고, includeEnded=true 면
        끝난 강좌도 나옵니다. 수집에서 빠진(비활성) 강좌는 나오지 않습니다. q 는 강좌명·강좌내용·운영기관명 부분일치,
        targetType 은 쉼표로 여러 개를 주면 그중 하나라도 맞는 강좌입니다. receiptOpen=true 면 오늘(서울) 접수 중인 강좌만,
        operDay 는 쉼표로 준 요일 중 하나라도 운영하는 강좌, timeOfDay 는 수업 시작 시각 구간입니다. sort 는
        edcStartDate·receiptEndDate·lectureName 과 asc·desc 이며 기본 edcStartDate,asc, 값이 없는 강좌는 뒤로 갑니다.
        sort=receiptStatus,asc 는 오늘(서울) 기준 접수 중(마감 빠른 순) → 접수 예정(접수 시작 빠른 순) → 접수 기간 모름(교육
        시작 순) → 접수 마감(최근 마감 순)으로 세우며 asc 만 됩니다(desc 는 400).
        구·군별 건수는 GET /public-courses/facets 로 받습니다. 인증 없이 호출합니다.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: method, in: query, schema: {type: string, enum: [OFFLINE, ONLINE, HYBRID, VISIT]}}
        - name: targetType
          in: query
          description: 교육대상(원문 값, 예 어르신·청년/직장인·지역주민). 여러 개는 쉼표로 잇고 그중 하나라도 맞으면 나옵니다. 최대 10개.
          schema: {type: string, maxLength: 550}
        - {name: regionCode, in: query, schema: {type: string, enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72']}}
        - {name: free, in: query, schema: {type: boolean}}
        - {name: from, in: query, description: 교육 기간이 이 날짜 이후와 겹치는 강좌, schema: {type: string, format: date}}
        - {name: to, in: query, description: 교육 기간이 이 날짜 이전과 겹치는 강좌. from 보다 앞서면 400, schema: {type: string, format: date}}
        - {name: includeEnded, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/PublicCourseReceiptOpen'}
        - {$ref: '#/components/parameters/PublicCourseOperDay'}
        - {$ref: '#/components/parameters/PublicCourseTimeOfDay'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/PublicCoursePageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /public-courses/facets:
    get:
      operationId: getPublicCourseFacets
      tags: [PublicCourse]
      summary: 공공데이터 평생학습강좌 구·군별 건수
      description: >-
        GET /public-courses 와 같은 조건(regionCode·page·size·sort 제외)으로 센 구·군별 건수입니다. 대구 9개 구·군을
        regionCode 드롭다운 순서로 0 건까지 모두 돌려주고, total 은 구·군을 모르는 강좌까지 센 전체 건수라 regions 합보다
        클 수 있습니다. 구·군 탭·칩의 숫자를 한 번에 그릴 때 씁니다. 인증 없이 호출합니다.
      security: []
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: method, in: query, schema: {type: string, enum: [OFFLINE, ONLINE, HYBRID, VISIT]}}
        - name: targetType
          in: query
          description: 교육대상(원문 값). 여러 개는 쉼표로 잇고 그중 하나라도 맞으면 셉니다. 최대 10개.
          schema: {type: string, maxLength: 550}
        - {name: free, in: query, schema: {type: boolean}}
        - {name: from, in: query, description: 교육 기간이 이 날짜 이후와 겹치는 강좌, schema: {type: string, format: date}}
        - {name: to, in: query, description: 교육 기간이 이 날짜 이전과 겹치는 강좌. from 보다 앞서면 400, schema: {type: string, format: date}}
        - {name: includeEnded, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/PublicCourseReceiptOpen'}
        - {$ref: '#/components/parameters/PublicCourseOperDay'}
        - {$ref: '#/components/parameters/PublicCourseTimeOfDay'}
      responses:
        '200': {$ref: '#/components/responses/PublicCourseFacetsOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /public-courses/{courseId}:
    parameters:
      - {$ref: '#/components/parameters/PublicCourseId'}
    get:
      operationId: getPublicCourse
      tags: [PublicCourse]
      summary: 공공데이터 평생학습강좌 상세
      description: >-
        목록 항목에 강사·강좌내용·주소·전화·접수·인정 여부를 더한 상세입니다. 문자열은 외부 기관이 올린 원문이므로 HTML 이 아닌
        텍스트로 표시합니다. 수집에서 빠진 강좌도 공유 링크를 위해 돌려주며
        active=false 로 표시합니다. 없으면 404 PUBLIC_COURSE_NOT_FOUND. 인증 없이 호출합니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/PublicCourseOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/public-courses/sync:
    post:
      operationId: startPublicCourseSync
      tags: [PublicCourse]
      summary: 공공데이터 강좌 수집 실행(관리자)
      description: >-
        대구 기관의 강좌를 공공데이터포털에서 다시 받습니다. 바로 202 와 runId 를 돌려주고 수집은 뒤에서 돕니다. 진행 상태는
        GET /admin/public-course-sync-runs/{runId} 로 봅니다. 이미 돌고 있으면 409 PUBLIC_COURSE_SYNC_RUNNING.
        플랫폼 관리자 전용입니다.
      responses:
        '202': {$ref: '#/components/responses/PublicCourseSyncStarted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/public-course-sync-runs:
    get:
      operationId: listPublicCourseSyncRuns
      tags: [PublicCourse]
      summary: 공공데이터 강좌 수집 이력(관리자)
      description: 자동·수동 수집 실행을 최신 시작순으로 봅니다. 플랫폼 관리자 전용입니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/PublicCourseSyncRunPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/public-course-sync-runs/{runId}:
    parameters:
      - {$ref: '#/components/parameters/PublicCourseSyncRunId'}
    get:
      operationId: getPublicCourseSyncRun
      tags: [PublicCourse]
      summary: 공공데이터 강좌 수집 실행 상세(관리자)
      description: >-
        상태(RUNNING·SUCCEEDED·PARTIAL·FAILED), 건수, 기관별 결과(SUCCEEDED·FAILED·EMPTY)를 봅니다. PARTIAL 은 일부 기관이
        실패했거나 0건이었다는 뜻이며 그 기관의 기존 강좌는 그대로 둡니다. 없으면 404 PUBLIC_COURSE_SYNC_RUN_NOT_FOUND.
      responses:
        '200': {$ref: '#/components/responses/PublicCourseSyncRunOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호입니다.
      schema: {type: integer, format: int32, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: 한 페이지에 반환할 항목 수입니다. 1에서 100 사이이며 기본값은 20입니다.
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
    Sort:
      name: sort
      in: query
      description: 정렬 기준을 field,direction 형식으로 지정합니다.
      schema: {type: string}
      example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일한 상태 변경 요청의 중복 처리를 방지하는 요청 키입니다.
      schema: {type: string, minLength: 8, maxLength: 128}
    NoticeId:
      name: noticeId
      in: path
      required: true
      description: 공지 식별자입니다.
      schema: {type: string, format: uuid}
    ContentPageId:
      name: pageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PublicCourseReceiptOpen:
      name: receiptOpen
      in: query
      description: true 면 오늘(서울) 접수 중인 강좌만. 접수마감일이 오늘 이후이고 접수시작일이 오늘 이전이거나 없는 강좌입니다. 접수마감일이 없는 강좌는 빠집니다.
      schema: {type: boolean, default: false}
    PublicCourseOperDay:
      name: operDay
      in: query
      description: 운영 요일(월·화·수·목·금·토·일). 여러 개는 쉼표로 잇고(예 토,일) 그중 하나라도 운영하면 나옵니다. 다른 값은 400.
      schema: {type: string, maxLength: 20}
    PublicCourseTimeOfDay:
      name: timeOfDay
      in: query
      description: 수업 시작 시각 구간. MORNING 12:00 전, AFTERNOON 12:00~18:00 전, EVENING 18:00 부터. 시작 시각이 없는 강좌는 빠집니다.
      schema: {type: string, enum: [MORNING, AFTERNOON, EVENING]}
    PublicCourseId:
      name: courseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PublicCourseSyncRunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MenuId:
      name: menuId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContentSlug:
      name: slug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9-]{2,100}$', example: about}
    BadgeDefinitionId:
      name: definitionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClassificationCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: '^TSIX_[0-9]{6}$'}
    FaqId:
      name: faqId
      in: path
      required: true
      description: FAQ 식별자입니다.
      schema: {type: string, format: uuid}
    BannerId:
      name: bannerId
      in: path
      required: true
      description: 배너 식별자입니다.
      schema: {type: string, format: uuid}
    FileId:
      name: fileId
      in: path
      required: true
      description: 업로드 파일 식별자입니다.
      schema: {type: string, format: uuid}
    InstitutionApplicationId:
      name: applicationId
      in: path
      required: true
      description: 기관 등록 신청 식별자입니다.
      schema: {type: string, format: uuid}
    InquiryId:
      name: inquiryId
      in: path
      required: true
      description: 문의 식별자입니다.
      schema: {type: string, format: uuid}
    InterestId:
      name: interestId
      in: path
      required: true
      description: 관심 강좌 식별자입니다.
      schema: {type: string, format: uuid}
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 알림 식별자입니다.
      schema: {type: string, format: uuid}
    InstitutionId:
      name: institutionId
      in: path
      required: true
      description: 기관 식별자입니다.
      schema: {type: string, format: uuid}
    InstructorApplicationId:
      name: applicationId
      in: path
      required: true
      description: 강사 신청 식별자입니다.
      schema: {type: string, format: uuid}
    CourseId:
      name: courseId
      in: path
      required: true
      description: 과정 식별자입니다.
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 과정 회차 식별자입니다.
      schema: {type: string, format: uuid}
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      description: 수강신청 식별자입니다.
      schema: {type: string, format: uuid}
    AttendanceId:
      name: attendanceId
      in: path
      required: true
      description: 출결 기록 식별자입니다.
      schema: {type: string, format: uuid}
    CompletionId:
      name: completionId
      in: path
      required: true
      description: 이수 기록 식별자입니다.
      schema: {type: string, format: uuid}
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: Credential 식별자입니다.
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      description: 사용자 식별자입니다.
      schema: {type: string, format: uuid}
    BadgeId:
      name: badgeId
      in: path
      required: true
      description: 학습 Badge 식별자입니다.
      schema: {type: string, format: uuid}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: 과정 첨부파일 식별자입니다.
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    TooManyRequests:
      description: IP별 요청 제한 초과. 서버 재시작 시 카운터가 초기화됩니다.
      headers:
        Retry-After:
          description: 재시도까지 기다릴 초 수
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    UnprocessableEntity:
