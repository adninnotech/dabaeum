          type: object
          additionalProperties: false
          description: >-
            사이트 전체 강사 통계. 한 강사가 여러 기관에 소속돼도 COUNT(DISTINCT user_id) 로
            한 번만 센다. 사용자 상태 매핑은 기관 대시보드의 instructorTotal 계열과 같다 —
            ACTIVE 는 active, DORMANT·SUSPENDED 는 inactive, WITHDRAWN 은 withdrawn.
          required: [total, active, inactive, withdrawn]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            active: {type: integer, format: int64, minimum: 0}
            inactive: {type: integer, format: int64, minimum: 0}
            withdrawn: {type: integer, format: int64, minimum: 0}
