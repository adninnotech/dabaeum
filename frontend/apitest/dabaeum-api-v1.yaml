      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 신청자에게 전달할 강사 신청 거절 사유입니다.
    User:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date}
        status: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}
        withdrawnAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date}
        status:
          type: string
          enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]
