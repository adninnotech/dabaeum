      summary: 기관 소속 강사 명단 조회
      description: 기관에 소속된 강사 명단을 담당 과정 수·메모와 함께 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          description: 사용자 상태 필터입니다.
          schema:
            type: string
            enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 이름·이메일·연락처 부분일치 검색. 연락처는 하이픈을 무시한다.
      responses:
        '200': {$ref: '#/components/responses/InstitutionInstructorPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/learners/lookup:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    post:
      operationId: lookupInstitutionLearner
      tags: [Institution]
      summary: 대리 수강신청 대상 학습자 정확 일치 조회
      description: >-
        기관 관리자가 대리 수강신청할 학습자를 평생학번 또는 이메일과 생년월일로 찾습니다. 검색이 아니라
        두 값이 모두 일치하는 1명만 돌려주며, learnerNo 와 email 중 정확히 하나와 birthDate 를 보냅니다.
        데이터를 바꾸지 않는 조회지만 학번·이메일·생년월일이 접근 로그와 브라우저 기록에 남지 않도록 URL
        쿼리가 아니라 본문으로 받습니다.
        이메일은 대소문자와 앞뒤 공백을 무시합니다. 대상은 대리 수강신청과 같은 기준(ACTIVE 이고 전역 또는
        이 기관의 LEARNER 역할)입니다. 대상이 아니거나 생년월일이 다르거나 회원 정보에 생년월일이 없으면
        모두 같은 404 이고, 어느 값이 틀렸는지 알려 주지 않습니다. 같은 이메일·생년월일의 대상이 둘
        이상이면 고르지 않고 409(LEARNER_LOOKUP_AMBIGUOUS)이므로 평생학번으로 다시 조회합니다. 그 기관의 INSTITUTION_ADMIN 과
        PLATFORM_ADMIN 만 호출할 수 있고, 조회는 관리자 접속기록에 남습니다. 같은 IP 에서 분당 30회,
        같은 계정에서 24시간 200회, 같은 학번(또는 이메일)은 누가 조회하든 성공·실패를 합쳐 24시간 10회로
        제한합니다(모두 429 RATE_LIMITED, Retry-After). 학번과 이메일은 따로 셉니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearnerLookupRequest'}
      responses:
        '200': {$ref: '#/components/responses/InstitutionLearnerLookupOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /notices:
    get:
      operationId: listNotices
      tags: [Support]
