      operationId: createMyPortfolioShare
      tags: [User]
      summary: 포트폴리오 공유 링크 만들기
      description: >-
        고른 수료증·배지만 담은 공유 링크를 만듭니다. credentialIds·badgeIds 를 생략하면 전부, 주면 본인 것만(아니면 422).
        기본 30일, 최대 365일. 응답의 token 은 이때 한 번만 보이며, 프론트가 {origin}/portfolio/{token} 주소를 만듭니다.
