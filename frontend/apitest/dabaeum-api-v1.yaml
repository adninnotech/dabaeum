      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/NoticeAttachment'}
        meta: {$ref: '#/components/schemas/ApiMeta'}

    NoticeAttachmentAttachRequest:
      type: object
