    post:
      operationId: bulkCreateCourseSessions
      tags: [Course Session]
      summary: 과정 회차 일괄 생성
      description: >-
        반복 규칙(요일·시간·첫 수업일·총 회차) 또는 직접 입력한 회차 배열 중 하나로 여러 회차를
        한 트랜잭션에서 생성합니다. replaceExisting 이 true 면 기존 회차를 모두 지우고 다시
        만들며, 출결이 기록됐거나 QR 이 발급된 회차가 있으면 409 로 거부됩니다.
        반복 규칙(repeat)은 replaceExisting 이 false 면 기존 마지막 회차 번호 다음부터 번호를 매겨 뒤에 붙이고,
        true 면 1회차부터 매깁니다. 직접 입력(sessions)은 요청한 sessionNo 를 그대로 쓰며 겹치면 409 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseSessionBulkCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/CourseSessionBulkCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/sessions/order:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    put:
      operationId: reorderCourseSessions
      tags: [Course Session]
      summary: 과정 회차 순서 재정렬
      description: >-
        드래그 핸들로 바뀐 순서대로 sessionNo 를 다시 매깁니다. sessionIds 는 과정의 회차
        전부를 정확히 한 번씩, 새 순서대로 담아야 하며 일부만 보내면 422 로 거부됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseSessionReorderRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseSessionsReordered'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      operationId: getCourseSession
      tags: [Course Session]
      summary: 과정 회차 상세 조회
      description: 회차 식별자로 회차 상세 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/CourseSessionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateCourseSession
      tags: [Course Session]
      summary: 과정 회차 수정
      description: 시작 전 회차의 일정과 운영 정보를 수정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseSessionUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseSessionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/enrollments:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    get:
      operationId: listCourseEnrollments
      tags: [Enrollment]
      summary: 과정 수강신청 목록 조회
      description: 과정에 접수된 수강신청을 상태와 페이지 조건으로 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/EnrollmentPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createEnrollment
      tags: [Enrollment]
      summary: 수강신청 생성
      description: >-
        사용자가 과정에 수강신청을 등록합니다. 과정이 RECRUITING 이 아니면 409 COURSE_STATUS_CONFLICT,
        모집 마감일(recruitEndDate, 서울 날짜 기준 그날까지 접수)이 지났으면 409 COURSE_RECRUITMENT_ENDED 입니다.
        정원이 차면 실패가 아니라 WAITLISTED 로 접수됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnrollmentCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/proxy-enrollments:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    post:
      operationId: createProxyEnrollment
      tags: [Enrollment]
      summary: 대리 수강신청 생성
      description: >-
        관리자가 사용자를 대신해 수강신청을 등록합니다. 상태·모집 마감일·정원 규칙은 본인 신청과 같습니다
        (409 COURSE_STATUS_CONFLICT · 409 COURSE_RECRUITMENT_ENDED · 정원 초과는 WAITLISTED).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyEnrollmentCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/EnrollmentCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      operationId: getEnrollment
      tags: [Enrollment]
      summary: 수강신청 상세 조회
      description: 수강신청 식별자로 신청 상태와 기본 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/bulk-decision:
    post:
      operationId: bulkDecideEnrollments
      tags: [Enrollment]
      summary: 수강신청 일괄 승인·반려
      description: >-
        목록에서 체크한 수강신청을 한 번에 승인하거나 반려합니다. 부분 성공을 허용해 처리된 건은
        succeeded, 실패한 건은 사유와 함께 failed 로 돌려줍니다. 다른 기관 건이 섞여 있으면
        아무것도 처리하지 않고 403 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentBulkDecisionRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnrollmentBulkDecisionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/approve:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: approveEnrollment
      tags: [Enrollment]
      summary: 수강신청 승인
      description: 관리자가 대기 중인 수강신청을 승인합니다.
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/reject:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: rejectEnrollment
      tags: [Enrollment]
      summary: 수강신청 반려
      description: 관리자가 수강신청을 반려하고 사유를 기록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentRejectionRequest'}
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: cancelEnrollment
      tags: [Enrollment]
      summary: 수강신청 취소
      description: 승인 전후 정책에 따라 수강신청을 취소합니다.
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/withdraw:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: withdrawEnrollment
      tags: [Enrollment]
      summary: 수강 철회
      description: >-
        승인된 수강신청을 철회합니다. 수강자 본인 또는 수강 결정 권한자(PLATFORM_ADMIN, 그 기관
        INSTITUTION_ADMIN, 그 과정의 MAIN 강사)가 호출합니다. 이수가 평가(ELIGIBLE)·확정(COMPLETED)된
        수강은 누구도 철회할 수 없습니다(409 ENROLLMENT_WITHDRAW_AFTER_COMPLETION, 이수 확정 취소 정정이 먼저).
        본인 철회는 수업 시작(취소되지 않은 첫 회차 시작 시각, 회차가 없으면 startDate 의 서울 00:00)
        24시간 전까지만 가능하고(dabaeum.enrollment.withdrawal.self-cutoff), 그 뒤이거나 출석(PRESENT·LATE)한
        회차가 있으면 결정 권한자만 처리합니다(403 ENROLLMENT_WITHDRAW_REQUIRES_MANAGER, details 에
        `selfWithdrawDeadline=<ISO-8601>`). 출결 이력은 지우지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/EnrollmentOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /sessions/{sessionId}/reopen:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      operationId: reopenCourseSession
      tags: [Course]
      summary: 회차 재개 (관리자 정정)
      description: >-
        잘못 마감한 회차를 다시 엽니다. PLATFORM_ADMIN만 호출할 수 있고 사유가 필수이며
        정정 이력이 남습니다. COMPLETED 회차에서만 가능하고 그 외에는 409
        CORRECTION_NOT_ALLOWED 입니다. Idempotency-Key는 사용하지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectionReasonRequest'}
      responses:
        '200': {$ref: '#/components/responses/CourseSessionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /sessions/{sessionId}/qr-token:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      operationId: issueAttendanceQrToken
      tags: [Attendance]
      summary: 출결 QR 토큰 발급
      description: >-
        단기 출결 QR 토큰을 발급합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN, 같은 과정의 MAIN_INSTRUCTOR가 호출할 수 있습니다.
        재발급하면 이전 토큰은 대체되며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '201': {$ref: '#/components/responses/AttendanceQrTokenCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /sessions/{sessionId}/attendance:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      operationId: listSessionAttendance
      tags: [Attendance]
      summary: 회차 출결 목록 조회
      description: >-
        회차의 출결 목록을 조회합니다. 같은 기관의 INSTITUTION_ADMIN 또는 과정에
        배정된 INSTRUCTOR가 호출할 수 있습니다. 조회 재시도는 안전하며
        Idempotency-Key는 사용하지 않습니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/AttendancePageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: recordAttendance
      tags: [Attendance]
      summary: 출결 기록 등록
      description: >-
        승인된 수강신청의 출결을 ADMIN(수동) 방식으로 기록합니다. 같은 기관 관리자 또는
        MAIN_INSTRUCTOR만 호출합니다. 학습자의 일반 QR(attendanceMethod=QR)은 닫혀
        422 ATTENDANCE_METHOD_NOT_SUPPORTED 이며, 다대구 회원은 강사 QR(attendUrl)로 QR_DADAEGU 기록됩니다. 동일 회차·수강신청 중복 요청은 409를 반환하며
        Idempotency-Key는 사용하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/AttendanceCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /attend-sessions:
    post:
      operationId: openAttendSession
      tags: [Attendance]
      summary: 학생 다대구 출석 세션 열기
      description: >-
        프론트 학생 출석 페이지(/attend?t=)가 강사 QR 의 t 값을 그대로 보내 학생 한 명분
        다대구 인증 세션을 엽니다. 로그인하지 않고 호출합니다 — 본인 확인은 다대구 DID 가,
        현장 확인은 QR 토큰이 합니다. 응답의 deepLink(didapp://...)로 location.href 를 바꿔
        다대구 앱을 엽니다. 세션 수명은 약 90초이며, 앱 인증 뒤 서버가 QR_DADAEGU/PRESENT 로
        기록합니다. QR 토큰이 위조·폐기됐으면 409 ATTENDANCE_QR_INVALID, 만료됐으면
        409 ATTENDANCE_QR_EXPIRED, 다대구 세션 발급 실패는 503 입니다. local/dev 환경 전용입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendSessionCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/AttendSessionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /attend-sessions/{attendId}:
    parameters:
      - name: attendId
        in: path
        required: true
        description: openAttendSession 이 돌려준 출석 세션 식별자입니다.
        schema: {type: string, format: uuid}
    get:
      operationId: getAttendSession
      tags: [Attendance]
      summary: 학생 다대구 출석 결과 조회
      description: >-
        학생 폰이 다대구 앱에서 돌아온 순간(visibilitychange·pageshow)과 확인 버튼을 눌렀을 때
        부릅니다. 타이머로 반복 호출하지 않습니다 — 서버가 같은 세션을 3초 안에 다시 다대구에 묻지
        않고, 돌아오지 않는 학생을 위해 45초·90초에 스스로 확인합니다. state 가 FAILED 면
        errorCode 로 이유(AUTHENTICATION_FAILED·ENROLLMENT_NOT_FOUND·
        ENROLLMENT_STATUS_CONFLICT·ATTENDANCE_CONFLICT)를 알립니다. 없거나 만료 뒤 정리된
        세션은 404 ATTEND_SESSION_NOT_FOUND 입니다. 로그인하지 않고 호출하며 local/dev 환경 전용입니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/AttendSessionOk'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /attendance/{attendanceId}:
    parameters:
      - {$ref: '#/components/parameters/AttendanceId'}
    get:
      operationId: getAttendance
      tags: [Attendance]
      summary: 출결 상세 조회
      description: >-
        출결 기록 하나를 조회합니다. ENROLLMENT_SUBJECT, 같은 기관의
        INSTITUTION_ADMIN 또는 과정에 배정된 INSTRUCTOR가 호출할 수 있습니다.
        조회 재시도는 안전하며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/AttendanceOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    patch:
      operationId: adjustAttendance
      tags: [Attendance]
      summary: 출결 보정
      description: >-
        기존 출결을 삭제하지 않고 보정 이력을 추가합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN, 과정의 MAIN 강사가 호출할 수 있습니다(보조 강사는 403).
        중복 또는 잘못된 상태는 409 또는 422를 반환하며 Idempotency-Key는
        사용하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceAdjustmentRequest'}
      responses:
        '200': {$ref: '#/components/responses/AttendanceOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/attendance-summary:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      operationId: getAttendanceSummary
      tags: [Attendance]
      summary: 출결 요약 조회
      description: >-
        수강신청별 출결 요약을 조회합니다. ENROLLMENT_SUBJECT, 같은 기관의
        INSTITUTION_ADMIN 또는 과정에 배정된 INSTRUCTOR가 호출할 수 있습니다.
        센 회차(totalSessions)는 취소되지 않은 회차 중 종료됐거나 출결 창이 지난 회차, 그리고 진행 중·시작 전이라도
        이 수강에 출결 기록이 이미 있는 회차입니다. 그중 수강 승인 전에 시작해 기록이 없는 회차는 결석이 아니라
        대상 밖으로 봅니다. 출석률 = (출석 + 지각) / (totalSessions − 공결) × 100 이며 분모가 0 이면 0 입니다.
        공결은 분모에서 뺍니다. 강사 수강 현황(enrollment-status)·진도 상세(progress)의 attendanceRate 와
        이수 평가의 출석률도 같은 규칙입니다. 조회 재시도는 안전하며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/AttendanceSummaryOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    get:
      operationId: getCompletion
      tags: [Completion]
      summary: 이수 상태 조회
      description: >-
        수강신청의 이수 상태를 조회합니다. ENROLLMENT_SUBJECT, 같은 기관의
        INSTITUTION_ADMIN 또는 과정에 배정된 INSTRUCTOR가 호출할 수 있습니다.
        조회 재시도는 안전하며 Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion/evaluate:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: evaluateCompletion
      tags: [Completion]
      summary: 이수 평가
      description: >-
        서버가 계산한 출결 지표로 이수를 평가합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN 또는 같은 과정·기관의 MAIN_INSTRUCTOR가 호출할 수
        있습니다. 본문의 지표는 참고용이며 판정은 항상 서버 계산값으로 하고
        그 값을 응답에 담습니다. failureReason 을 주면 NOT_COMPLETED 입니다. 사유가 없어도
        서버 출석률이 이수 기준(기본 80%) 미만이면 NOT_COMPLETED 이고 failureReason 에
        "출석률 미달 (x% < 80%)" 이 자동으로 들어갑니다. 그 밖에는 ELIGIBLE 입니다. 확정 전 재평가가 가능합니다. Idempotency-Key는 사용하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletionEvaluationRequest'}
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion/confirm:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: confirmCompletion
      tags: [Completion]
      summary: 이수 확정
      description: >-
        ELIGIBLE 상태의 이수를 확정합니다. PLATFORM_ADMIN, 같은 기관의
        INSTITUTION_ADMIN 또는 같은 과정·기관의 MAIN_INSTRUCTOR가 호출할 수
        있습니다. 이미 확정된 이수를 다시 확정하면 409를 반환하며
        Idempotency-Key는 사용하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/contexts/lifelong-education/v1:
    get:
      operationId: getLifelongEducationContextV1
      tags: [VC Public]
      summary: 평생교육 VC JSON-LD Context 조회
      description: 다배움 평생교육 이수 VC의 custom term을 정의한 변경 불가능한 v1 Context입니다. 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: JSON-LD Context
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/VcContextDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/vocabulary/lifelong-education/v1:
    get:
      operationId: getLifelongEducationVocabularyV1
      tags: [VC Public]
      summary: 평생교육 VC 용어 문서 조회
      description: v1 Context에서 사용하는 용어 URL, 한글 설명과 값 형식을 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 평생교육 VC vocabulary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VcVocabularyDocument'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/issuers/{institutionId}:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    get:
      operationId: getCredentialIssuer
      tags: [VC Public]
      summary: Credential 발급기관 공개키 조회
      description: 기관이 발급한 VC의 JOSE kid가 가리키는 W3C Controlled Identifier 문서와 Ed25519 public JWK를 인증 없이 조회합니다.
      security: []
      responses:
        '200':
          description: 기관 Controlled Identifier 문서
          content:
            application/ld+json:
              schema: {$ref: '#/components/schemas/CredentialIssuerDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/status/{credentialNo}:
    parameters:
      - name: credentialNo
        in: path
        required: true
        description: 공개 검증할 Credential 번호입니다.
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'}
    get:
      operationId: getPublicCredentialStatus
      tags: [VC Public]
      summary: Credential 공개 상태 조회
      description: 실제 원장(대구체인) Provider 가 붙어 있을 때 DB·서명·저장 hash·원장 상태를 검증하고 최소 상태 정보만 반환합니다. 인증 없이 호출할 수 있으며 실제 원장 검증 서비스가 없으면 503을 반환합니다.
      security: []
      responses:
        '200':
          description: 공개 Credential 상태
          headers:
            Cache-Control:
              description: 상태 응답 캐시를 금지합니다.
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicCredentialStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /vc/status-lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        description: 발급기관별 Bitstring Status List 식별자입니다. VC의 credentialStatus.statusListCredential이 가리킵니다.
        schema: {type: string, format: uuid}
    get:
      operationId: getCredentialStatusList
      tags: [VC Public]
      summary: Credential 폐기 상태 리스트 조회
      description: W3C Bitstring Status List v1.0 규격의 BitstringStatusListCredential을 인증 없이 조회합니다. 리스트 하나가 발급기관 수료증 최대 131,072장의 폐기 여부를 비트 하나씩으로 담고, 개인정보·이수 정보는 포함하지 않습니다. 검증자는 VC의 statusListIndex 번째 비트가 1이면 폐기로 판정합니다. 발급기관 키로 서명한 Compact JWS를 반환하며 서명 서비스가 없으면 503을 반환합니다.
      security: []
      responses:
        '200':
          description: BitstringStatusListCredential Compact JWS
          headers:
            Cache-Control:
              description: 검증자가 리스트를 최대 60초 캐시할 수 있습니다.
              schema: {type: string}
          content:
            application/vc+jwt:
              schema: {type: string, description: Compact JWS}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /enrollments/{enrollmentId}/completion/revert:
    parameters:
      - {$ref: '#/components/parameters/EnrollmentId'}
    post:
      operationId: revertCompletionConfirmation
      tags: [Completion]
      summary: 이수 확정 취소 (관리자 정정)
      description: >-
        확정된 이수를 ELIGIBLE 로 되돌립니다. PLATFORM_ADMIN만 호출할 수 있고 사유가
        필수이며 정정 이력이 남습니다. 수료증이 이미 발급된 이수는 원장 기록을 지울 수 없어
        409 CORRECTION_NOT_ALLOWED 로 거부합니다. Idempotency-Key는 사용하지 않습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CorrectionReasonRequest'}
      responses:
        '200': {$ref: '#/components/responses/CompletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /completions/{completionId}/credentials:
    parameters:
      - {$ref: '#/components/parameters/CompletionId'}
    post:
      operationId: issueCredential
      tags: [Credential]
      summary: Credential 발급 요청
      description: PLATFORM_ADMIN 또는 해당 과정 기관의 INSTITUTION_ADMIN이 확정 이수를 Credential 발급 대기 상태로 요청합니다. 202 응답 후 상세 조회 API로 PENDING·ISSUING·ISSUED·FAILED 상태를 polling합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialIssueRequest'}
      responses:
        '202': {$ref: '#/components/responses/CredentialAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    get:
      operationId: getCredential
      tags: [Credential]
      summary: Credential 상세 조회
      description: 본인, 해당 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 Credential 발급 상태와 메타데이터를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/CredentialOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /credentials/{credentialId}/document:
    parameters:
      - {$ref: '#/components/parameters/CredentialId'}
    get:
      operationId: downloadCredentialDocument
      tags: [Credential]
      summary: 서명된 VC 문서 다운로드
      description: 본인, 해당 과정 기관의 INSTITUTION_ADMIN 또는 PLATFORM_ADMIN이 저장 hash와 서명을 검증한 Compact JWS를 다운로드합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: RFC 7515 Compact JWS 형식의 W3C VC
          headers:
            Content-Disposition:
              description: Credential 번호 기반 다운로드 파일명입니다.
              schema: {type: string}
            Cache-Control:
              description: VC 원문 캐시를 금지합니다.
              schema: {type: string, const: no-store}
          content:
            application/vc+jwt:
              schema: {type: string, description: Compact JWS}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/credentials:
    get:
      operationId: listCurrentUserCredentials
      tags: [Credential]
      summary: 내 Credential 목록 조회
      description: 인증된 사용자가 자신의 Credential 목록을 조회합니다. userId는 요청 경로 또는 query로 받지 않으며 인증 컨텍스트에서 결정합니다.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/CredentialPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/credentials:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserCredentials
      tags: [Credential]
      summary: 사용자 Credential 목록 조회
      description: >-
        본인과 PLATFORM_ADMIN은 사용자의 모든 Credential을 조회합니다. INSTITUTION_ADMIN은
