  /search:
    get:
      operationId: searchAll
      tags: [Support]
      summary: 통합검색
      description: >-
        강좌·기관·공지·FAQ 를 한 번에 부분일치로 찾습니다. 탭마다 전체 개수(total)와 유사도 순 상위 limit 개를 줍니다.
        "더보기" 는 각 탭의 기존 목록 API(/courses?q= 등)로 이어갑니다. q 는 앞뒤 공백 제거 후 2~100자(아니면 400).
        노출 규칙은 공개 목록과 같습니다(강좌: 초안·취소 제외, 기관: 운영 중, 공지: 게시된 전체 공개). 인증 없이 호출합니다.
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 5}, description: 탭당 개수}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/popular:
    get:
      operationId: listPopularCourses
      tags: [Course]
      summary: 인기 강좌 조회
      description: >-
        최근 30일 수강신청(×3)과 상세 조회(×1)로 매시 계산한 인기 강좌입니다. regionCode(우리 지역) 또는 ageBand(내 또래)
        중 하나만 줄 수 있고(둘 다 주면 400), 둘 다 없으면 전체 인기입니다. 로그인 사용자의 구·군·연령대는 프론트가 넘깁니다.
        집계가 아직 없으면 빈 목록입니다. 인증 없이 호출합니다.
      security: []
      parameters:
        - {name: regionCode, in: query, schema: {type: string, enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']}}
        - name: ageBand
          in: query
          description: 10(10대 이하)·20·30·40·50·60·70(70대 이상)
          schema: {type: string, enum: ['10', '20', '30', '40', '50', '60', '70']}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200':
          description: Popular courses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PopularCourseListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/recommended:
    get:
      operationId: listRecommendedCourses
      tags: [Course]
      summary: 홈 추천 강좌 조회
      description: >-
        홈 "추천 강좌" 섹션(docs/specs/course-recommendation.md). 인증 없이 호출하며, Bearer 를 주면 로그인 사용자로 개인화합니다.
        야간 모델 배치가 로그인 학습자에게 매긴 점수 행이 있으면 그 강좌를 신청 확률 순으로 먼저 채웁니다(basis=MODEL, matchLevel 0,
        reason.type=MODEL_SCORE). 점수 행이 없거나 모자라면 아래 규칙 기반 순서가 그대로 적용됩니다.
        찜·수강신청이 있으면 그 강좌의 표준 분류와 비슷한 모집 중 강좌(basis=PERSONAL, matchLevel 3 소분류·2 중분류·1 대분류 일치),
        없으면 연령대 인기(AGE_BAND) → 구·군 인기(REGION) → 전체 인기(POPULAR) 순으로 대신 채웁니다. 비로그인은 전체 인기만 탑니다.
        exclude 에는 홈 인기 섹션에 이미 그린 강좌 id 를 쉼표로 넘깁니다(최대 20개) — 두 섹션에 같은 강좌가 두 번 나오지 않습니다.
        이미 신청·찜한 강좌, 모집 중이 아닌 강좌, 정원·대기가 찬 강좌, 같은 기관의 같은 제목 반복은 빠집니다.
        basis 로 섹션 제목을 정하고(MODEL "회원님을 위한 추천", PERSONAL "회원님 맞춤 강좌", AGE_BAND "30대가 많이 듣는 강좌", REGION "달서구 인기 강좌",
        POPULAR "이런 강좌는 어때요"), 항목마다 reason 으로 이유 문장을 만듭니다. 비어 있으면 섹션을 숨깁니다.
        로그인 사용자 응답은 노출 로그로 남고 항목마다 impressionId 가 있습니다(비로그인은 null).
        모델 점수는 다음 날 배치 뒤에 반영되며, 찜 직후의 변화는 규칙 기반 항목에 바로 반영됩니다.
      security: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 6}}
        - name: exclude
          in: query
          description: 홈 인기 섹션에 보인 강좌 id. 쉼표 구분, 최대 20개
          schema: {type: string}
      responses:
        '200':
          description: Recommended courses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/recommended/{impressionId}/click:
    post:
      operationId: clickRecommendedCourse
      tags: [Course]
      summary: 추천 강좌 클릭 기록
      description: >-
        추천 카드를 눌렀을 때 한 번 부릅니다. 본인의 노출(impressionId)에 첫 클릭 시각을 남깁니다.
        실패해도 화면 이동을 막지 않습니다. 남의 노출이거나 없거나 이미 클릭했으면 404 RECOMMENDATION_IMPRESSION_NOT_FOUND.
      parameters:
        - {name: impressionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 받음
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationClickAcceptedResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /courses/{courseId}/views:
    parameters:
      - {$ref: '#/components/parameters/CourseId'}
    post:
      operationId: recordCourseView
      tags: [Course]
      summary: 강좌 상세 조회 기록
      description: >-
        강좌 상세 화면에 들어갈 때 한 번 부릅니다(상세 GET 에는 부수효과가 없습니다). 같은 사람은 하루 1건으로 셉니다.
        로그인하지 않아도 되고, 비로그인 조회는 IP·브라우저 정보를 그날의 salt 로 익명화해 남깁니다(원문은 저장하지 않음).
        인기 강좌 집계에 쓰입니다. 강좌가 없거나 비공개여도 같은 200 응답입니다(존재 여부를 알리지 않음).
      security: []
      responses:
        '200':
          description: 받음(기록되었거나 무시됨)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseViewAcceptedResponse'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /badge-definitions:
    get:
      operationId: listBadgeDefinitions
      tags: [Badge]
      summary: 배지 도감 조회
      description: 사용 중인 배지 정의(이름·설명·이미지·획득 조건)를 조회합니다. 인증 없이 호출합니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionListOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/badge-definitions:
    get:
      operationId: listAdminBadgeDefinitions
      tags: [Badge]
      summary: 배지 정의 전체 조회(관리자)
      description: 사용 중지된 정의까지 조회합니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 생성
      description: >-
        배지 정의를 만듭니다. 규칙은 COURSE_COMPLETION(courseId 또는 classificationCode 중 하나 — 분류는 하위 포함) 또는
        CUMULATIVE(count, 선택 classificationCode) 두 가지뿐입니다. 수료가 확정되는 순간 규칙에 맞으면 자동 발급되며 사람당 한 번입니다.
        code 는 대문자·숫자·밑줄 2~50자이고 바꿀 수 없습니다. 중복이면 409 BADGE_DEFINITION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BadgeDefinitionRequest'}
      responses:
        '201': {$ref: '#/components/responses/BadgeDefinitionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/badge-definitions/{definitionId}:
    parameters:
      - {$ref: '#/components/parameters/BadgeDefinitionId'}
    get:
      operationId: getBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 상세
      description: 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 수정
      description: >-
        이름·설명·이미지·규칙을 바꿉니다(code 는 무시). 이미 이 정의로 발급된 배지가 있으면 규칙은 바꿀 수 없습니다(409 BADGE_DEFINITION_IN_USE).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BadgeDefinitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 삭제
      description: 발급된 배지가 있는 정의는 지울 수 없습니다(409 BADGE_DEFINITION_IN_USE). 대신 사용 중지하세요.
      responses:
        '200': {$ref: '#/components/responses/DeletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/badge-definitions/{definitionId}/activate:
    parameters:
      - {$ref: '#/components/parameters/BadgeDefinitionId'}
    post:
      operationId: activateBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 사용
      description: 다시 자동 발급 대상과 도감에 넣습니다.
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/badge-definitions/{definitionId}/deactivate:
    parameters:
      - {$ref: '#/components/parameters/BadgeDefinitionId'}
    post:
      operationId: deactivateBadgeDefinition
      tags: [Badge]
      summary: 배지 정의 사용 중지
      description: 자동 발급과 도감에서 빠집니다. 이미 발급된 배지는 그대로 남습니다.
      responses:
        '200': {$ref: '#/components/responses/BadgeDefinitionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /menus:
    get:
      operationId: listPublicMenus
      tags: [Cms]
      summary: 공개 메뉴 트리
      description: >-
        사이트 내비게이션용 2단계 메뉴 트리입니다. 숨김 메뉴와 그 하위 메뉴, 게시되지 않은 콘텐츠 페이지를 가리키는 메뉴는 빠집니다.
        CONTENT 메뉴는 contentSlug 로 GET /contents/pages/{slug} 를 호출합니다. 인증 없이 호출합니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/PublicMenuTreeOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /contents/pages/{slug}:
    parameters:
      - {$ref: '#/components/parameters/ContentSlug'}
    get:
      operationId: getPublicContentPage
      tags: [Cms]
      summary: 게시된 콘텐츠 페이지 조회
      description: 게시(PUBLISHED)된 페이지만 돌려줍니다. 초안이거나 없으면 404 CONTENT_PAGE_NOT_FOUND. 본문은 저장 시 정제된 HTML 입니다. 인증 없이 호출합니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/PublicContentPageOk'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/content-pages:
    get:
      operationId: listAdminContentPages
      tags: [Cms]
      summary: 콘텐츠 페이지 목록(관리자)
      description: 초안을 포함한 전체 페이지를 최근 수정순으로 조회합니다. 본문은 빠집니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/ContentPageListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 생성
      description: >-
        초안(DRAFT)으로 만듭니다. slug 는 소문자·숫자·하이픈 2~100자이며 중복이면 409 CONTENT_PAGE_CONFLICT.
        bodyHtml 은 허용 태그만 남기고 정제되어 저장됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentPageRequest'}
      responses:
        '201': {$ref: '#/components/responses/ContentPageCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/content-pages/{pageId}:
    parameters:
      - {$ref: '#/components/parameters/ContentPageId'}
    get:
      operationId: getAdminContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 상세(관리자)
      description: 초안도 조회합니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/ContentPageOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 수정
      description: slug·제목·본문을 통째로 바꿉니다. 게시 상태는 그대로입니다. slug 중복이면 409 CONTENT_PAGE_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentPageRequest'}
      responses:
        '200': {$ref: '#/components/responses/ContentPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 삭제
      description: 메뉴가 가리키는 페이지는 지울 수 없습니다(409 CONTENT_PAGE_IN_USE). 메뉴를 먼저 바꾸거나 지우세요.
      responses:
        '200': {$ref: '#/components/responses/DeletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/content-pages/{pageId}/publish:
    parameters:
      - {$ref: '#/components/parameters/ContentPageId'}
    post:
      operationId: publishContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 게시
      description: 공개 조회와 공개 메뉴에 나타납니다. 이미 게시된 페이지는 publishedAt 을 유지합니다.
      responses:
        '200': {$ref: '#/components/responses/ContentPageOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/content-pages/{pageId}/unpublish:
    parameters:
      - {$ref: '#/components/parameters/ContentPageId'}
    post:
      operationId: unpublishContentPage
      tags: [Cms]
      summary: 콘텐츠 페이지 게시 취소
      description: 초안으로 되돌립니다. 이 페이지를 가리키는 메뉴는 공개 트리에서 빠집니다.
      responses:
        '200': {$ref: '#/components/responses/ContentPageOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/menus:
    get:
      operationId: listAdminMenus
      tags: [Cms]
      summary: 메뉴 트리(관리자)
      description: 숨김 메뉴를 포함한 2단계 트리입니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/AdminMenuTreeOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createMenu
      tags: [Cms]
      summary: 메뉴 생성
      description: >-
        linkType 에 맞는 대상 하나만 씁니다 — ROUTE 는 routeKey(GET /admin/menus/routes), CONTENT 는 contentPageId,
        EXTERNAL 은 http(s) externalUrl. parentId 는 최상위 메뉴만 가능합니다(2단계). 규칙 위반은 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MenuRequest'}
      responses:
        '201': {$ref: '#/components/responses/MenuCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/menus/routes:
    get:
      operationId: listMenuRoutes
      tags: [Cms]
      summary: 메뉴 ROUTE 키 목록
      description: ROUTE 메뉴가 가리킬 수 있는 화면 키입니다. 프론트가 키를 실제 경로로 바꿉니다.
      responses:
        '200': {$ref: '#/components/responses/MenuRouteListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/menus/order:
    put:
      operationId: reorderMenus
      tags: [Cms]
      summary: 메뉴 배치 변경
      description: >-
        [{id, parentId, sortOrder}] 를 한 번에 받아 부모와 순서를 바꿉니다. 결과가 2단계를 넘거나 모르는 id·중복 id 가 있으면
        422 이며 아무것도 바뀌지 않습니다. 바뀐 전체 트리를 돌려줍니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MenuOrderRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdminMenuTreeOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/menus/{menuId}:
    parameters:
      - {$ref: '#/components/parameters/MenuId'}
    put:
      operationId: updateMenu
      tags: [Cms]
      summary: 메뉴 수정
      description: 전체를 바꿉니다. 하위 메뉴가 있는 메뉴는 다른 메뉴의 하위로 옮길 수 없습니다(422).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MenuRequest'}
      responses:
        '200': {$ref: '#/components/responses/MenuOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteMenu
      tags: [Cms]
      summary: 메뉴 삭제
      description: 하위 메뉴가 있으면 409 SITE_MENU_HAS_CHILDREN. 가리키던 콘텐츠 페이지는 남습니다.
      responses:
        '200': {$ref: '#/components/responses/DeletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /course-classifications:
    get:
      operationId: listCourseClassifications
      tags: [Course]
      summary: 강좌 분류 트리 조회
      description: >-
        표준 강좌 분류(TSIX_AABBCC, 1→2→3단계)를 트리로 조회합니다. 사용 중지된 분류와 그 하위는 빠집니다.
        강좌 등록 폼과 강좌 목록 필터(GET /courses?classificationCode=)가 씁니다. 인증 없이 호출합니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/CourseClassificationTreeOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/course-classifications:
    get:
      operationId: listAdminCourseClassifications
      tags: [Course]
      summary: 강좌 분류 전체 트리 조회(관리자)
      description: 사용 중지된 분류까지 포함한 전체 트리를 enabled 와 함께 조회합니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/CourseClassificationTreeOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/course-classifications/{code}/enable:
    parameters:
      - {$ref: '#/components/parameters/ClassificationCode'}
    post:
      operationId: enableCourseClassification
      tags: [Course]
      summary: 강좌 분류 사용
      description: 분류를 다시 사용합니다. 코드와 이름은 표준이 정하므로 바꿀 수 없습니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/CourseClassificationOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/course-classifications/{code}/disable:
    parameters:
      - {$ref: '#/components/parameters/ClassificationCode'}
    post:
      operationId: disableCourseClassification
      tags: [Course]
      summary: 강좌 분류 사용 중지
      description: >-
        분류를 사용 중지합니다. 이미 그 분류를 쓰는 강좌는 그대로 두지만 새 강좌 등록·수정에는 쓸 수 없고,
        공개 트리에서 그 분류와 하위가 빠집니다. 플랫폼 관리자 전용입니다.
      responses:
        '200': {$ref: '#/components/responses/CourseClassificationOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/notices/{noticeId}/attachments:
    parameters:
      - {$ref: '#/components/parameters/NoticeId'}
    get:
      operationId: listNoticeAttachments
      tags: [Support]
      summary: 공지 첨부파일 목록 조회
      description: 사이트 관리자가 공지에 붙은 첨부파일 목록을 파일명·크기·등록일과 함께 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/NoticeAttachmentListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: attachNoticeAttachment
      tags: [Support]
      summary: 공지에 파일 첨부
      description: >-
        사이트 관리자가 이미 업로드된 파일을 공지에 첨부합니다. 파일의 purpose 는
        NOTICE_ATTACHMENT 여야 하고, 같은 파일을 같은 공지에 두 번 첨부할 수 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoticeAttachmentAttachRequest'}
      responses:
        '201': {$ref: '#/components/responses/NoticeAttachmentCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/notices/{noticeId}/attachments/{attachmentId}:
    parameters:
      - {$ref: '#/components/parameters/NoticeId'}
      - {$ref: '#/components/parameters/AttachmentId'}
    delete:
      operationId: detachNoticeAttachment
      tags: [Support]
      summary: 공지 첨부파일 제거
      description: 사이트 관리자가 공지에서 첨부파일을 제거합니다.
      responses:
        '200': {$ref: '#/components/responses/NoticeAttachmentOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /banners:
    get:
      operationId: listBanners
      tags: [Support]
      summary: 공개 배너 목록 조회
      description: >-
        E-1 홈 최상단 캐러셀에 띄울 배너를 표시 순서대로 조회합니다. 지금 보이는 배너만
        내려가며 비공개 배너와 기간 밖 배너는 빠집니다. 인증 없이 사용할 수 있습니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/BannerListOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/banners:
    get:
      operationId: listAdminBanners
      tags: [Support]
      summary: 배너 관리 목록 조회
      description: >-
        B-10 배너 관리 화면용으로 비공개 배너와 기간 밖 배너까지 전부 조회합니다.
        플랫폼 관리자만 사용할 수 있습니다.
      responses:
        '200': {$ref: '#/components/responses/BannerListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createBanner
      tags: [Support]
      summary: 배너 등록
      description: >-
        배너를 등록합니다. visibility 를 주지 않으면 PRIVATE 로 만들어집니다. SCHEDULED 는
        startAt 과 endAt 이 둘 다 있어야 하고, 이미지 파일은 purpose 가 BANNER 여야 합니다.
        플랫폼 관리자만 사용할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BannerCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/BannerCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/banners/{bannerId}:
    parameters:
      - {$ref: '#/components/parameters/BannerId'}
    put:
      operationId: updateBanner
      tags: [Support]
      summary: 배너 수정
      description: >-
        배너를 수정합니다. 본문 전체를 덮어쓰며 등록과 같은 규칙이 적용됩니다.
        플랫폼 관리자만 사용할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BannerUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/BannerOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      operationId: deleteBanner
      tags: [Support]
      summary: 배너 삭제
      description: 배너를 삭제합니다. 플랫폼 관리자만 사용할 수 있습니다.
      responses:
        '200': {$ref: '#/components/responses/DeletionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /inquiries:
    post:
      operationId: createInquiry
      tags: [Inquiry]
      summary: 문의 등록
      description: 문의를 등록합니다. 과정 문의는 courseId를 함께 전달합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InquiryCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/InquiryCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /inquiries/{inquiryId}:
    parameters:
      - {$ref: '#/components/parameters/InquiryId'}
    get:
      operationId: getInquiry
      tags: [Inquiry]
      summary: 문의 상세 조회
      description: 문의 상세를 조회합니다. 작성자 본인 또는 답변 권한자만 조회할 수 있습니다.
      responses:
        '200': {$ref: '#/components/responses/InquiryOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /inquiries/{inquiryId}/reply:
    parameters:
      - {$ref: '#/components/parameters/InquiryId'}
    post:
      operationId: replyInquiry
      tags: [Inquiry]
      summary: 문의 답변
      description: 문의에 답변합니다. 해당 과정의 강사·기관 관리자·플랫폼 관리자만 사용할 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InquiryReplyRequest'}
      responses:
        '200': {$ref: '#/components/responses/InquiryOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/inquiries:
    get:
      operationId: listMyInquiries
      tags: [Inquiry]
      summary: 내 문의 목록 조회
      description: 로그인한 사용자의 문의 목록을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, ANSWERED]}
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 강의명·기관명·강사명 부분일치 검색. 대소문자를 구분하지 않는다.
      responses:
        '200': {$ref: '#/components/responses/InquiryPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/inquiries:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserInquiries
      tags: [Inquiry]
      summary: 사용자 문의 목록 조회(관리자)
      description: 회원 상세 화면용으로 특정 사용자가 등록한 문의 목록을 조회합니다. PLATFORM_ADMIN 전용입니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, ANSWERED]}
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 강의명·기관명·강사명 부분일치 검색. 대소문자를 구분하지 않는다.
      responses:
        '200': {$ref: '#/components/responses/InquiryPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructors/me/inquiries:
    get:
      operationId: listInstructorInquiries
      tags: [Inquiry]
      summary: 강사 담당 과정 문의 목록 조회
      description: 로그인한 강사가 배정된 과정의 문의 목록을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, ANSWERED]}
        - name: courseId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/InquiryPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructors/{userId}/inquiries:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listInstructorInquiriesByUser
      tags: [Inquiry]
      summary: 특정 강사 담당 과정 문의 목록 조회
      description: >-
        플랫폼 관리자가 강사 상세 화면에서 그 강사가 배정된 과정의 문의를 조회합니다.
        응답과 필터는 /instructors/me/inquiries 와 같고, 대상 강사만 경로로 지정합니다.
        me 판은 호출자 본인을 뜻하므로 관리자에게 남의 것을 주지 않는다 — 그래서 경로를
        따로 둔다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: status
          in: query
          schema: {type: string, enum: [PENDING, ANSWERED]}
        - name: courseId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/InquiryPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/access-logs:
    get:
      operationId: listAdminAccessLogs
      tags: [Admin]
      summary: 관리자 접속기록 조회
      description: >-
        관리자가 회원·수강·문의 개인정보를 조회·변경한 기록(개인정보의 안전성 확보조치 기준 제8조)을 최신순으로
        조회합니다. 플랫폼 관리자 전용이며 기록은 추가만 되고 수정·삭제 API 는 없습니다. 2년이 지난 기록은 매일
        자동 삭제됩니다. from·to 는 서울 날짜이며 둘 다 포함합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: actorId, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string, enum: [READ, UPDATE, DELETE, DOWNLOAD]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {$ref: '#/components/responses/AdminAccessLogPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/statistics/enrollments:
    get:
      operationId: getEnrollmentStatistics
      tags: [Admin]
      summary: 수강 통계
      description: >-
        기간 안의 수강 신청·승인·수료를 groupBy 축으로 셉니다. CONTENT(강좌별, 신청 내림차순 상위 limit), YEAR, MONTH,
        REGION(신청 시점 구·군), AGE_BAND(신청 시점 만 나이 10세 단위, 생년월일 없으면 미상). applied 는 기간 안에 만든 신청(모든 상태),
        approved 는 기간 안에 승인됐고 지금도 승인 상태인 신청(철회·취소되면 빠집니다), completed 는 기간 안에 확정된 수료입니다. 수료율은 completed ÷ approved 로 계산하세요.
        플랫폼 관리자 전용입니다.
      parameters:
        - {name: groupBy, in: query, required: true, schema: {type: string, enum: [CONTENT, YEAR, MONTH, REGION, AGE_BAND]}}
        - {name: from, in: query, schema: {type: string, format: date}, description: 서울 날짜. 기본 올해 1월 1일}
        - {name: to, in: query, schema: {type: string, format: date}, description: 서울 날짜(포함). 기본 오늘. 최대 5년}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}, description: csv 면 UTF-8 BOM 을 붙인 text/csv 로 내려받는다(관리자 접속기록에 DOWNLOAD 로 남는다)}
        - {name: classificationCode, in: query, schema: {type: string, pattern: '^TSIX_[0-9]{6}$'}, description: 표준 분류(하위 포함)}
        - {name: institutionId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: CONTENT 에서만 쓴다}
      responses:
        '200':
          description: Enrollment statistics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentStatisticsResponse'}
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
