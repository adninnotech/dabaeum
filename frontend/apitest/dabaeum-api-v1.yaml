  schemas:
    VcContextDocument:
      type: object
      additionalProperties: false
      required: ['@context']
      properties:
        '@context':
          type: object
          description: 보호된 다배움 평생교육 이수 VC custom term 정의입니다.
          additionalProperties: true
    VcVocabularyTerm:
      type: object
      additionalProperties: false
      required: [term, id, description, valueFormat]
      properties:
        term: {type: string}
        id: {type: string, format: uri}
        description: {type: string}
        valueFormat: {type: string}
    VcVocabularyDocument:
      type: object
      additionalProperties: false
      required: [id, version, terms]
      properties:
        id: {type: string, format: uri}
        version: {type: string, const: v1}
        terms:
          type: array
          minItems: 9
          maxItems: 9
          items: {$ref: '#/components/schemas/VcVocabularyTerm'}
    PublicEd25519Jwk:
      type: object
      additionalProperties: false
      required: [kid, kty, crv, alg, use, x]
      properties:
        kid: {type: string, format: uri}
        kty: {type: string, const: OKP}
        crv: {type: string, const: Ed25519}
        alg: {type: string, const: EdDSA}
        use: {type: string, const: sig}
        x: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    CredentialVerificationMethod:
      type: object
      additionalProperties: false
      required: [id, type, controller, publicKeyJwk]
      properties:
        id: {type: string, format: uri}
        type: {type: string, const: JsonWebKey}
        controller: {type: string, format: uri}
        publicKeyJwk: {$ref: '#/components/schemas/PublicEd25519Jwk'}
    CredentialIssuerDocument:
      type: object
      additionalProperties: false
      required: ['@context', id, verificationMethod, assertionMethod]
      properties:
        '@context': {type: string, const: 'https://www.w3.org/ns/cid/v1'}
        id: {type: string, format: uri}
        verificationMethod:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CredentialVerificationMethod'}
        assertionMethod:
          type: array
          minItems: 1
          items: {type: string, format: uri}
    PublicCredentialStatus:
      type: object
      additionalProperties: false
      required: [credentialNo, status, checkedAt]
      properties:
        credentialNo: {type: string, minLength: 1, maxLength: 100}
        status:
          type: string
          enum: [VALID, INVALID, REVOKED, SUPERSEDED, EXPIRED, NOT_FOUND, ERROR]
        checkedAt: {type: string, format: date-time}
    ApiMeta:
      type: object
      additionalProperties: false
      required: [requestId, timestamp]
      properties:
        requestId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId, timestamp]
      properties:
        code: {type: string}
        message: {type: string}
        details:
          type: array
          items: {type: string}
        requestId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page: {type: integer, format: int32, minimum: 0}
        size: {type: integer, format: int32, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int32, minimum: 0}
    SystemPingData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [OK]}
    Institution:
      type: object
      additionalProperties: false
      required: [id, institutionCode, name, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        institutionCode: {type: string, maxLength: 50}
        name: {type: string, maxLength: 200}
        businessNumber: {type: [string, 'null'], maxLength: 20}
        representativeName: {type: [string, 'null'], maxLength: 100}
        address: {type: [string, 'null']}
        contactPhone: {type: [string, 'null'], maxLength: 30}
        contactEmail: {type: [string, 'null'], format: email, maxLength: 320}
        status: {type: string, enum: [ACTIVE, INACTIVE, SUSPENDED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        homepageUrl: {type: [string, 'null'], maxLength: 500}
        region: {type: [string, 'null'], maxLength: 50}
        logoFileId: {type: [string, 'null'], format: uuid}
        introduction: {type: [string, 'null'], maxLength: 2000}
        administrators:
          type: array
          description: 상세 조회에서만 온다. 목록 조회 응답에는 이 필드가 없다.
          items: {$ref: '#/components/schemas/InstitutionAdministrator'}
        instructorCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            소속 강사 수. administrators 와 반대로 목록 조회에서만 오고 상세 응답에는
            이 필드가 없다 — 관리자 기관 목록 화면이 쓰는 값이다.
        courseCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: 이 기관이 개설한 과정 수(삭제된 과정 제외). 목록 조회에서만 온다.
        learnerCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            이 기관 과정에 승인 수강 중인 학습자 수. 같은 사람이 여러 과정을 들어도
            1 로 센다. 목록 조회에서만 온다.
        adminCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            기관 관리자(INSTITUTION_ADMIN) 계정 수. 상세 응답의 administrators 배열 길이와
            같다. 목록에서 배열을 행마다 채우면 N+1 이라 건수만 싣는다. 목록 조회에서만 온다.
        primaryAdminName:
          type: [string, 'null']
          maxLength: 100
          description: >-
            대표 기관 관리자 이름. 가장 먼저 배정된 관리자이며 상세 응답 administrators[0].name 과
            같다. 목록 화면의 "김다혜 외 3명" 은 이 값과 adminCount - 1 로 만든다. 목록
            조회에서만 오고, 관리자가 없으면(adminCount 0) 이 필드가 없다.
    InstitutionAdministrator:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
    InstitutionCreateRequest:
      type: object
      additionalProperties: false
      required: [institutionCode, name]
      properties:
        institutionCode: {type: string, minLength: 1, maxLength: 50}
        name: {type: string, minLength: 1, maxLength: 200}
        businessNumber: {type: [string, 'null'], maxLength: 20}
        representativeName: {type: [string, 'null'], maxLength: 100}
        address: {type: [string, 'null']}
        contactPhone: {type: [string, 'null'], maxLength: 30}
        contactEmail: {type: [string, 'null'], format: email, maxLength: 320}
        status: {type: string, enum: [ACTIVE, INACTIVE, SUSPENDED], default: ACTIVE}
        homepageUrl: {type: [string, 'null'], maxLength: 500}
        region: {type: [string, 'null'], maxLength: 50}
        logoFileId: {type: [string, 'null'], format: uuid}
        introduction: {type: [string, 'null'], maxLength: 2000}
    InstitutionUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        institutionCode: {type: string, minLength: 1, maxLength: 50}
        name: {type: string, minLength: 1, maxLength: 200}
        businessNumber: {type: [string, 'null'], maxLength: 20}
        representativeName: {type: [string, 'null'], maxLength: 100}
        address: {type: [string, 'null']}
        contactPhone: {type: [string, 'null'], maxLength: 30}
        contactEmail: {type: [string, 'null'], format: email, maxLength: 320}
        status: {type: string, enum: [ACTIVE, INACTIVE, SUSPENDED]}
        homepageUrl: {type: [string, 'null'], maxLength: 500}
        region: {type: [string, 'null'], maxLength: 50}
        logoFileId: {type: [string, 'null'], format: uuid}
    InstructorApplication:
      type: object
      additionalProperties: false
      required:
        [id, userId, applicantName, institutionId, status, appliedAt,
         createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        applicantName: {type: string, maxLength: 100}
        applicantEmail: {type: [string, 'null'], format: email, maxLength: 320}
        applicantPhone: {type: [string, 'null'], maxLength: 30}
        institutionId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        applicationMessage: {type: [string, 'null'], maxLength: 1000}
        rejectionReason: {type: [string, 'null'], maxLength: 1000}
        reviewedBy: {type: [string, 'null'], format: uuid}
        appliedAt: {type: string, format: date-time}
        reviewedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    InstructorApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        applicationMessage:
          type: [string, 'null']
          maxLength: 1000
          description: 선택 입력인 강사 지원 사유입니다. 앞뒤 공백은 서버에서 제거합니다.
    InstructorApplicationRejectRequest:
      type: object
      additionalProperties: false
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: 신청자에게 전달할 강사 신청 거절 사유입니다.
    User:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, updatedAt, emailNotificationEnabled, smsNotificationEnabled, roles]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date}
        status: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}
        withdrawnAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        career: {type: [string, 'null'], maxLength: 2000}
        introduction: {type: [string, 'null'], maxLength: 2000}
        profileImageId: {type: [string, 'null'], format: uuid}
        gender: {type: [string, 'null'], enum: [MALE, FEMALE, UNDISCLOSED, null]}
        region: {type: [string, 'null'], maxLength: 50}
        learnerNo:
          type: [string, 'null']
          pattern: '^[0-9]{9}$'
          description: >-
            평생학번(YY + 구군 2자리 + 일련번호 5자리). 가입 순간 DB 가 매기며 바뀌지 않는다.
            저장된 사용자는 항상 값이 있다.
        regionCode:
          type: [string, 'null']
          enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99', null]
          description: 가입 때 고른 구·군 코드(GET /regions). 저장된 사용자는 항상 값이 있다.
        lastLoginAt: {type: [string, 'null'], format: date-time}
        emailNotificationEnabled: {type: boolean}
        smsNotificationEnabled: {type: boolean}
        enrollmentCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            승인된 수강 건수. 관리자 회원 목록(GET /users)에서만 채우고 그 외 조회에서는
            아예 나오지 않는다 — adminMemo 와 같은 방식이다. 목록이 행마다
            GET /users/{id}/learning-stats 를 부르지 않도록 싣는다.
        courseCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            이 사용자가 강사로 배정된 과정 수. 관리자 목록(GET /users)에서만 채우며,
            강사 역할이 없는 사용자는 0 이다. 목록이 행마다
            GET /instructors/{id}/courses/stats 를 부르지 않도록 싣는다.
            기관 범위의 같은 값은 InstitutionInstructor.courseCount 에 있다.
        adminMemo:
          type: [string, 'null']
          maxLength: 1000
          description: 관리자 전용. 본인 조회(/users/me)에는 나오지 않는다
        roles:
          type: array
          description: >-
            이 사용자가 가진 역할입니다. 회원 목록이 행마다 GET /users/{userId}/roles 를
            부르지 않도록 사용자 응답에 함께 내려 줍니다. 역할이 없으면 빈 배열입니다.
            프로필 사진은 profileImageId 로 내려갑니다.
          items: {$ref: '#/components/schemas/RoleSummary'}
    RoleSummary:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId: {type: [string, 'null'], format: uuid}
        institutionName: {type: [string, 'null'], maxLength: 200}
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date, description: '서울 기준 오늘까지. 오늘보다 뒤면 422 VALIDATION_FAILED(details [birthDate]). null 이면 지운다.'}
        status:
          type: string
          enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]
          default: ACTIVE
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date, description: '서울 기준 오늘까지. 오늘보다 뒤면 422 VALIDATION_FAILED(details [birthDate]). null 이면 지운다.'}
        career: {type: [string, 'null'], maxLength: 2000}
        introduction: {type: [string, 'null'], maxLength: 2000}
        profileImageId: {type: [string, 'null'], format: uuid}
        gender: {type: [string, 'null'], enum: [MALE, FEMALE, UNDISCLOSED, null]}
        region: {type: [string, 'null'], maxLength: 50}
        regionCode:
          type: string
          enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']
          description: 구·군 코드(GET /regions). 바꿔도 평생학번은 그대로입니다.
    UserStatusChangeRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}
    UserMemoUpdateRequest:
      type: object
      additionalProperties: false
      required: [memo]
      properties:
        memo: {type: [string, 'null'], maxLength: 1000}
    WithdrawRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 500}
    UserMeUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date, description: '서울 기준 오늘까지. 오늘보다 뒤면 422 VALIDATION_FAILED(details [birthDate]). null 이면 지운다.'}
        career: {type: [string, 'null'], maxLength: 2000}
        introduction: {type: [string, 'null'], maxLength: 2000}
        profileImageId: {type: [string, 'null'], format: uuid}
        gender: {type: [string, 'null'], enum: [MALE, FEMALE, UNDISCLOSED, null]}
        region: {type: [string, 'null'], maxLength: 50}
        regionCode:
          type: string
          enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']
          description: 구·군 코드(GET /regions). 바꿔도 평생학번은 그대로입니다.
    NotificationPreferenceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        emailNotificationEnabled: {type: boolean}
        smsNotificationEnabled: {type: boolean}
    Identity:
      type: object
      additionalProperties: false
      required: [id, provider, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [LOCAL, DADAEGU, DID]}
        verifiedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    IdentityResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Identity'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    IdentityListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Identity'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    IdentityLinkRequest:
      type: object
      additionalProperties: false
      required: [provider, providerSubject, verified]
      properties:
        provider: {type: string, enum: [LOCAL, DADAEGU, DID]}
        providerSubject: {type: string, minLength: 1, maxLength: 255}
        externalDid: {type: [string, 'null'], maxLength: 512}
        verified: {type: boolean}
    LocalIdentityLinkRequest:
      type: object
      additionalProperties: false
      description: 다대구 유저가 추가로 설정하는 이메일·비밀번호. 규칙은 SignupRequest 와 같다.
      required: [email, password]
      properties:
        email: {type: string, format: email, minLength: 1, maxLength: 320}
        password: {type: string, minLength: 10, maxLength: 72, writeOnly: true}
    Role:
      type: object
      additionalProperties: false
      required: [id, role, createdAt]
      properties:
        id: {type: string, format: uuid}
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
    RoleResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Role'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    RoleListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    RoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId: {type: [string, 'null'], format: uuid}
    MyInstitution:
      type: object
      additionalProperties: false
      required: [institutionId, name, role]
      properties:
        institutionId: {type: string, format: uuid}
        name: {type: string}
        role:
          type: string
          enum: [INSTITUTION_ADMIN, INSTRUCTOR]
    MyInstitutionListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/MyInstitution'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, regionCode, agreedToUsage, agreedToPrivacy]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: learner@example.com
          description: 로그인 아이디. 도메인에 점이 있어야 합니다(a@b 는 422 VALIDATION_FAILED, details [email]).
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          writeOnly: true
          description: UTF-8 기준 72바이트 이하의 비밀번호입니다.
        name: {type: string, minLength: 1, maxLength: 100, example: 홍길동}
        phone: {type: [string, 'null'], maxLength: 30, example: 010-1234-5678}
        birthDate: {type: [string, 'null'], format: date, example: '1995-05-10'}
        regionCode:
          type: string
          enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']
          description: 구·군 코드(GET /regions). 평생학번의 두 자리가 됩니다.
        agreedToUsage:
          type: boolean
          description: 이용약관 동의. 필수이며 true 가 아니면 422 입니다.
        agreedToPrivacy:
          type: boolean
          description: 개인정보 수집·이용 동의. 필수이며 true 가 아니면 422 입니다.
        agreedToMarketing:
          type: [boolean, 'null']
          description: 마케팅 정보 수신 동의 여부입니다. 선택 항목이라 미동의(false)여도 가입을 막지 않습니다.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: learner@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    DadaeguLoginRequest:
      type: object
      additionalProperties: false
      description: >-
        didLogin.js 콜백 returnData의 암호화 필드를 그대로 전달합니다.
        각 값은 다대구가 사이트 공개키로 암호화한 Base64 암호문이며,
        프론트는 복호화하지 않습니다. ci·gender·isForeigner는 받아도
        저장하지 않으며, SDK 버전업으로 늘어난 필드도 서버가 무시합니다.
      required: [did]
      properties:
        did: {type: string, minLength: 1, maxLength: 4096}
        name: {type: [string, 'null'], maxLength: 4096}
        birthdate: {type: [string, 'null'], maxLength: 4096}
        phoneNumber: {type: [string, 'null'], maxLength: 4096}
        ci: {type: [string, 'null'], maxLength: 4096}
        gender: {type: [string, 'null'], maxLength: 4096}
        isForeigner: {type: [string, 'null'], maxLength: 4096}
    DadaeguLoginResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DadaeguLoginData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    DadaeguLoginData:
      description: registrationRequired 로 두 모양을 구분합니다.
      oneOf:
        - $ref: '#/components/schemas/DadaeguLoginToken'
        - $ref: '#/components/schemas/DadaeguRegistrationRequired'
    DadaeguLoginToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, session, registrationRequired]
      properties:
        accessToken:
          type: string
          description: 보호 API의 Authorization Bearer 값으로 사용하는 Access Token입니다.
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, format: int64, minimum: 1, example: 3600}
        session: {$ref: '#/components/schemas/Session'}
        registrationRequired: {type: boolean, enum: [false]}
    DadaeguRegistrationRequired:
      type: object
      additionalProperties: false
      required: [registrationRequired, registrationToken, expiresAt, maskedName]
      properties:
        registrationRequired: {type: boolean, enum: [true]}
        registrationToken:
          type: string
          maxLength: 128
          description: 1회용 가입 토큰. 10분 뒤 만료됩니다. POST /auth/dadaegu/signup 에 그대로 보냅니다.
        expiresAt: {type: string, format: date-time}
        maskedName:
          type: string
          maxLength: 100
          description: '가입 화면 확인용으로 가린 이름입니다. 예: 홍*동'
    DadaeguSignupRequest:
      type: object
      additionalProperties: false
      required: [registrationToken, regionCode, agreedToUsage, agreedToPrivacy]
      properties:
        registrationToken: {type: string, minLength: 1, maxLength: 128}
        regionCode:
          type: string
          enum: ['11', '14', '17', '20', '23', '26', '29', '71', '72', '99']
          description: 구·군 코드(GET /regions). 평생학번의 두 자리가 됩니다.
        agreedToUsage: {type: boolean, description: 이용약관 동의. 필수이며 true 가 아니면 422 입니다.}
        agreedToPrivacy: {type: boolean, description: 개인정보 수집·이용 동의. 필수이며 true 가 아니면 422 입니다.}
        agreedToMarketing: {type: [boolean, 'null'], description: 마케팅 정보 수신 동의. 선택입니다.}
    DadaeguConfigResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [siteId]
          properties:
            siteId:
              type: string
              description: DIDLogin.loginPersonal에 전달할 공개 사이트 식별자입니다.
        meta: {$ref: '#/components/schemas/ApiMeta'}
    SessionRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId:
          type: [string, 'null']
          format: uuid
          description: >-
            LEARNER에서 null이면 모든 기관 과정에 신청 가능한 전역 학습자입니다.
            INSTITUTION_ADMIN과 INSTRUCTOR는 기관 UUID가 필수입니다.
    Session:
      type: object
      additionalProperties: false
      required: [userId, provider, roles, expiresAt, passwordExpired]
      properties:
        userId: {type: string, format: uuid}
        provider: {type: string, enum: [LOCAL, DADAEGU, DID]}
        roles:
          type: array
          items: {$ref: '#/components/schemas/SessionRole'}
        expiresAt: {type: [string, 'null'], format: date-time}
        passwordExpired:
          type: boolean
          description: >-
            관리자(PLATFORM_ADMIN·INSTITUTION_ADMIN) 계정의 LOCAL 비밀번호가 90일 이상 바뀌지 않았거나 관리자가 발급한
            임시 비밀번호이면 true. 프론트는 비밀번호 변경(PUT /users/me/password)을 안내한다. 접근은 막지 않는다.
            다대구 로그인·가입 응답에서는 항상 false.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Session'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    AuthToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, session]
      properties:
        accessToken:
          type: string
          description: 보호 API의 Authorization Bearer 값으로 사용하는 Access Token입니다.
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, format: int64, minimum: 1, example: 3600}
        session: {$ref: '#/components/schemas/Session'}
    AuthTokenResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/AuthToken'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    Course:
      type: object
      additionalProperties: false
      required:
        [id, institutionId, courseCode, title, educationType,
         creditBankEligible, status, createdAt, updatedAt, enrolledCount]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        courseCode: {type: string, maxLength: 50}
        title: {type: string, maxLength: 200}
        description: {type: [string, 'null']}
        classificationCode: {type: [string, 'null'], pattern: '^TSIX_[0-9]{6}$', description: 표준 강좌 분류 코드(설계서 §12). 하위가 없는 코드만 붙일 수 있다}
        classificationPath:
          type: array
          items: {type: string}
          description: 표시용 분류 경로(1→3단계 이름). 분류가 없으면 빈 배열
        educationType: {type: string, enum: [OFFLINE, ONLINE, HYBRID]}
        startDate: {type: [string, 'null'], format: date}
        endDate: {type: [string, 'null'], format: date}
        recruitStartDate: {type: [string, 'null'], format: date}
        recruitEndDate: {type: [string, 'null'], format: date}
        capacity: {type: [integer, 'null'], format: int32, minimum: 1}
        location: {type: [string, 'null'], maxLength: 500}
        onlineUrl: {type: [string, 'null'], format: uri, maxLength: 1000}
        creditBankEligible: {type: boolean}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        status:
          type: string
          enum: [DRAFT, RECRUITING, RECRUITMENT_CLOSED, IN_PROGRESS, COMPLETED, CANCELLED]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        thumbnailFileId: {type: [string, 'null'], format: uuid}
        detail: {$ref: '#/components/schemas/CourseDetail'}
        enrolledCount: {type: integer, format: int64, minimum: 0}
        institutionName:
          type: [string, 'null']
          maxLength: 200
          description: >-
            목록·상세 조회에서 채운다. 목록이 행마다 GET /institutions/{id} 를 부르지
            않도록 싣는다. 쓰기 응답 중 생성(POST /courses)만 null 이다 — 그 경로는
            방금 만든 애그리거트를 그대로 직렬화하고 집계를 다시 읽지 않는다. 수정·
            상태전환은 응답을 만들 때 다시 조회하므로 실제 값이 실린다.
        mainInstructorName:
          type: [string, 'null']
          maxLength: 100
          description: >-
            주강사(CourseInstructorRole.MAIN)의 이름. 강사가 아직 배정되지 않은 과정은
            읽기 조회에서도 null 이다. 쓰기 응답에서 null 인 것은 institutionName 과
            같다. 목록이 행마다 GET /courses/{id}/instructors 를 부르지 않도록 싣는다.
    CourseDetail:
      type: object
      additionalProperties: false
      description: |
        D-1·D-3 화면의 강좌 상세 설정. 요청·응답이 같은 스키마를 쓴다. 요청에서는 모든
        필드가 선택이며 생략한 필드는 도메인 기본값(FREE, FCFS, 빈 목록 등)으로 채워진다.
        응답에서는 도메인이 항상 정규화한 값을 채우므로 실질적으로 모두 값이 있다.
      properties:
        tags: {type: [string, 'null'], maxLength: 60}
        targetAudiences:
          type: array
          items:
            type: string
            enum:
              [ANYONE, CHILDREN, GUARDIANS_FAMILY, YOUTH, ADULTS,
               MIDDLE_AGED_SENIORS, MEN, WOMEN]
        instructorProfileVisible: {type: boolean, default: true}
        tuitionType: {type: string, enum: [FREE, PAID], default: FREE}
        tuitionAmount: {type: [number, 'null'], format: double, minimum: 0}
        materialFeeType: {type: string, enum: [FREE, PAID], default: FREE}
        materialFeeAmount: {type: [number, 'null'], format: double, minimum: 0}
        completionEnabled: {type: boolean, default: false}
        completionCriteria:
          type: [string, 'null']
          enum: [PROGRESS, ASSESSMENT, null]
        requiredProgressRate:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 100
        issueCertificate: {type: boolean, default: false}
        notes: {type: [string, 'null']}
        materials: {type: [string, 'null'], maxLength: 500}
        learningObjective: {type: [string, 'null']}
        selectionMethod: {type: string, enum: [FCFS, LOTTERY], default: FCFS}
        waitlistCapacity: {type: [integer, 'null'], format: int32, minimum: 0}
    CourseInstructor:
      type: object
      additionalProperties: false
      required:
        [id, courseId, userId, instructorName, role, assignedAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        instructorName: {type: string, maxLength: 100}
        instructorEmail: {type: [string, 'null'], format: email, maxLength: 320}
        role: {type: string, enum: [MAIN, ASSISTANT]}
        assignedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        introduction:
          type: [string, 'null']
          maxLength: 2000
          description: >-
            강좌 상세의 강사 소개란. User.introduction 을 조인해 싣는다. 강좌의
            detail.instructorProfileVisible 이 false 면 값이 있어도 null 로 내린다 —
            아래 career·profileImageId 도 같다.
        career:
          type: [string, 'null']
          maxLength: 2000
          description: User.career 를 조인해 싣는다. instructorProfileVisible 이 false 면 null.
        profileImageId:
          type: [string, 'null']
          format: uuid
          description: >-
            User.profileImageId 를 조인해 싣는다. instructorProfileVisible 이 false 면 null.
            파일 본문은 저장 파일 조회 경로로 따로 받는다.
    CourseInstructorAssignRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
          description: 같은 기관에서 INSTRUCTOR 역할을 가진 활성 사용자 식별자입니다.
        role: {type: string, enum: [MAIN, ASSISTANT]}
    CourseInstructorUpdateRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [MAIN, ASSISTANT]}
    CourseAttachment:
      type: object
      additionalProperties: false
      required: [id, courseId, fileId, fileName, byteSize, sortOrder, createdAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        fileId: {type: string, format: uuid}
        fileName: {type: string, maxLength: 255}
        byteSize: {type: integer, format: int64, minimum: 1}
        sortOrder: {type: integer, format: int32}
        createdAt: {type: string, format: date-time}
    NoticeAttachment:
      type: object
      additionalProperties: false
      required: [id, noticeId, fileId, fileName, byteSize, sortOrder, createdAt]
      properties:
        id: {type: string, format: uuid}
        noticeId: {type: string, format: uuid}
        fileId: {type: string, format: uuid}
        fileName: {type: string, maxLength: 255}
        byteSize: {type: integer, format: int64, minimum: 1}
        sortOrder: {type: integer, format: int32}
        createdAt: {type: string, format: date-time}

    NoticeAttachmentResponse:
      type: object
