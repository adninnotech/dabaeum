  /files:
    post:
      operationId: uploadFile
      tags: [File]
      summary: 파일 업로드
      description: 이미지는 JPEG·PNG·WebP, 강좌·공지 첨부는 PDF도 허용하며 최대 10MB입니다. 10MB를 넘으면 422 FILE_SIZE_EXCEEDED(details [file])를 반환합니다. 선언한 Content-Type과 파일 시작 바이트가 일치해야 하며, 불일치하면 422 FILE_TYPE_NOT_SUPPORTED를 반환합니다. 신규 INQUIRY 업로드는 허용하지 않습니다. 서버 디스크에 저장되고 응답의 url로 조회할 수 있습니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/FileUploadRequest'}
      responses:
        '201': {$ref: '#/components/responses/StoredFileCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /files/{fileId}/content:
    parameters:
      - {$ref: '#/components/parameters/FileId'}
