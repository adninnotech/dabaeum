    CourseAttachmentAttachRequest:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
          description: POST /files 로 먼저 업로드한 파일의 식별자입니다.
    CourseCreateRequest:
      type: object
      additionalProperties: false
      required: [institutionId, title, educationType]
      description: |
        startDate, endDate, capacity 는 임시저장(DRAFT)일 때만 생략할 수 있다.
        POST /courses/{id}/publish 시점에 세 값이 모두 있어야 하며, 없으면 422 로 거부한다.
      properties:
        institutionId: {type: string, format: uuid}
        courseCode:
          type: string
          maxLength: 50
          description: 생략하면 서버가 C-YYYYMM-XXXXXX 형식으로 생성한다.
        title: {type: string, minLength: 1, maxLength: 60}
        description: {type: [string, 'null']}
        classificationCode: {type: [string, 'null'], pattern: '^TSIX_[0-9]{6}$', description: 표준 강좌 분류 코드(설계서 §12). 하위가 없는 코드만 붙일 수 있다}
        educationType: {type: string, enum: [OFFLINE, ONLINE, HYBRID]}
        startDate: {type: [string, 'null'], format: date}
        endDate: {type: [string, 'null'], format: date}
        recruitStartDate: {type: [string, 'null'], format: date}
        recruitEndDate:
          type: [string, 'null']
          format: date
          description: '시작일(startDate)까지. 같은 날은 허용, 시작일보다 뒤면 422 VALIDATION_FAILED(details [recruitEndDate]).'
        capacity: {type: [integer, 'null'], format: int32, minimum: 1}
        location: {type: [string, 'null'], maxLength: 500}
        onlineUrl: {type: [string, 'null'], format: uri, maxLength: 1000}
        creditBankEligible: {type: boolean, default: false}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        thumbnailFileId: {type: [string, 'null'], format: uuid}
        detail: {$ref: '#/components/schemas/CourseDetail'}
    CourseUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        courseCode: {type: string, minLength: 1, maxLength: 50}
        title: {type: string, minLength: 1, maxLength: 60}
        description: {type: [string, 'null']}
        classificationCode: {type: [string, 'null'], pattern: '^TSIX_[0-9]{6}$', description: 표준 강좌 분류 코드(설계서 §12). 하위가 없는 코드만 붙일 수 있다}
        educationType: {type: string, enum: [OFFLINE, ONLINE, HYBRID]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        recruitStartDate: {type: [string, 'null'], format: date}
        recruitEndDate:
          type: [string, 'null']
          format: date
          description: '시작일(startDate)까지. 한쪽만 보내도 저장된 값과 비교하며, 시작일보다 뒤면 422 VALIDATION_FAILED(details [recruitEndDate]).'
        capacity: {type: integer, format: int32, minimum: 1}
        location: {type: [string, 'null'], maxLength: 500}
        onlineUrl: {type: [string, 'null'], format: uri, maxLength: 1000}
        creditBankEligible: {type: boolean}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        status:
          type: string
          enum: [DRAFT, RECRUITING, RECRUITMENT_CLOSED, IN_PROGRESS, COMPLETED, CANCELLED]
        thumbnailFileId: {type: [string, 'null'], format: uuid}
        detail: {$ref: '#/components/schemas/CourseDetail'}
    CourseSession:
      type: object
