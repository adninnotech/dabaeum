openapi: 3.1.0
info:
  title: Dabaeum API
  version: 1.0.0
  description: >-
    프론트엔드 연동을 위한 버전 관리 API 계약입니다. 각 operation은 기능별 tag로
    분류되며 구현이 완료된 API만 Try it out으로 호출할 수 있습니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: 시스템 상태 확인 API
  - name: Institution
    description: 기관 생성·조회·수정 API
  - name: Auth
    description: 개발용 LOCAL 회원가입·로그인과 인증 세션 API
  - name: User
    description: 사용자 계정·프로필·상태 API
  - name: Identity & Role
    description: 사용자 identity와 역할 범위 API
  - name: Instructor
    description: 기관 강사 신청·심사와 과정별 강사 배정 API
  - name: Course
    description: 교육 과정 API
  - name: Course Session
    description: 과정 회차와 일정 API
  - name: Enrollment
    description: 수강신청과 승인 상태 API
  - name: Attendance
    description: QR 출결·출결 보정·요약 API
  - name: Completion
    description: 이수 평가와 확정 API
  - name: Credential
    description: Credential 발급·조회·검증 API
  - name: VC Public
    description: W3C VC Context·용어·기관 공개키·상태 공개 API
  - name: Badge
    description: 학습 Badge 발급·조회 API
paths:
  /system/ping:
    get:
      operationId: getSystemPing
      tags: [System]
      summary: 시스템 상태 확인
      description: 서비스가 요청을 처리할 수 있는지 확인합니다. 인증 없이 호출할 수 있습니다.
      security: []
      responses:
        '200': {$ref: '#/components/responses/SystemPingOk'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions:
    get:
      operationId: listInstitutions
      tags: [Institution]
      summary: 기관 목록 조회
      description: 기관 목록을 페이지 단위로 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200': {$ref: '#/components/responses/InstitutionPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createInstitution
      tags: [Institution]
      summary: 기관 생성
      description: 새 기관을 생성합니다. 플랫폼 관리자 권한이 필요합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstitutionCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/InstitutionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    get:
      operationId: getInstitution
      tags: [Institution]
      summary: 기관 상세 조회
      description: 기관 식별자로 기관 상세 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/InstitutionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateInstitution
      tags: [Institution]
      summary: 기관 수정
      description: 기관의 기본 정보와 상태를 수정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstitutionUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/InstitutionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /institutions/{institutionId}/instructor-applications:
    parameters:
      - {$ref: '#/components/parameters/InstitutionId'}
    post:
      operationId: applyInstructor
      tags: [Instructor]
      summary: 기관 강사 신청
      description: >-
        전역 LEARNER 사용자가 선택한 기관의 강사로 신청합니다. 신청자 ID는
        인증 정보에서 가져오며 요청 본문으로 지정할 수 없습니다. 같은 기관에
        처리 중인 신청이나 이미 부여된 기관 강사 역할이 있으면 409를 반환합니다.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstructorApplicationRequest'}
      responses:
        '201': {$ref: '#/components/responses/InstructorApplicationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      operationId: listInstitutionInstructorApplications
      tags: [Instructor]
      summary: 기관 강사 신청 목록 조회
      description: 같은 기관의 기관 관리자 또는 플랫폼 관리자가 강사 신청을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          description: 신청 처리 상태 필터입니다.
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/me:
    get:
      operationId: listMyInstructorApplications
      tags: [Instructor]
      summary: 내 강사 신청 목록 조회
      description: 인증 사용자가 본인의 기관별 강사 신청 이력을 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          description: 신청 처리 상태 필터입니다.
          schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    get:
      operationId: getInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 상세 조회
      description: 신청자 본인, 같은 기관 관리자 또는 플랫폼 관리자가 신청 상세를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}/approve:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    post:
      operationId: approveInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 승인
      description: >-
        같은 기관의 기관 관리자 또는 플랫폼 관리자가 대기 신청을 승인하고 해당
        기관 범위 INSTRUCTOR 역할을 부여합니다. 기존 전역 LEARNER 역할은 유지됩니다.
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /instructor-applications/{applicationId}/reject:
    parameters:
      - {$ref: '#/components/parameters/InstructorApplicationId'}
    post:
      operationId: rejectInstructorApplication
      tags: [Instructor]
      summary: 강사 신청 거절
      description: 같은 기관의 기관 관리자 또는 플랫폼 관리자가 거절 사유와 함께 대기 신청을 거절합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstructorApplicationRejectRequest'}
      responses:
        '200': {$ref: '#/components/responses/InstructorApplicationOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users:
    get:
      operationId: listUsers
      tags: [User]
      summary: 사용자 목록 조회
      description: 사용자 목록을 상태와 페이지 조건으로 조회합니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}
      responses:
        '200': {$ref: '#/components/responses/UserPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createUser
      tags: [User]
      summary: 사용자 생성
      description: 새 사용자 계정을 생성합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/signup:
    post:
      operationId: signupLocalAccount
      tags: [Auth]
      summary: 일반 사용자 회원가입
      description: >-
        local/dev 환경에서 기관 선택 없이 일반 사용자를 가입시킵니다. 가입자는
        institutionId가 없는 전역 LEARNER 역할을 받아 여러 기관 과정에 본인
        수강신청할 수 있습니다. 운영 LOCAL 인증 활성화는 별도 범위입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignupRequest'}
      responses:
        '201': {$ref: '#/components/responses/LocalAccountCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/login:
    post:
      operationId: loginLocalAccount
      tags: [Auth]
      summary: 일반 사용자 로그인
      description: >-
        local/dev 환경에서 이메일과 비밀번호를 확인하고 Access Token을 발급합니다.
        이후 요청의 Authorization 헤더에 Bearer {accessToken} 형식으로 전달합니다.
        계정·비밀번호·사용자 상태 오류는 모두 같은 401 응답으로 반환합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/LocalAccountOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [Auth]
      summary: 현재 인증 세션 조회
      description: 현재 bearer token으로 인증된 사용자와 역할을 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/SessionOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [User]
      summary: 내 사용자 정보 조회
      description: 현재 로그인 사용자의 공개 프로필을 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateCurrentUser
      tags: [User]
      summary: 내 사용자 정보 수정
      description: 현재 로그인 사용자의 수정 가능한 프로필을 변경합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserMeUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: getUser
      tags: [User]
      summary: 사용자 상세 조회
      description: 사용자 식별자로 사용자 공개 정보를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    put:
      operationId: updateUser
      tags: [User]
      summary: 사용자 수정
      description: 관리자가 사용자 프로필 정보를 수정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/status:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      operationId: changeUserStatus
      tags: [User]
      summary: 사용자 상태 변경
      description: 사용자의 활성·휴면·정지·탈퇴 상태를 변경합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserStatusChangeRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/identities:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserIdentities
      tags: [Identity & Role]
      summary: 사용자 identity 목록 조회
      description: 사용자에 연결된 공개 identity 목록을 조회합니다. 원본 provider subject와 비밀 키는 반환하지 않습니다.
      responses:
        '200': {$ref: '#/components/responses/IdentityListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: linkUserIdentity
      tags: [Identity & Role]
      summary: 사용자 identity 연결
      description: 외부 인증 provider identity를 사용자 계정에 연결합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityLinkRequest'}
      responses:
        '201': {$ref: '#/components/responses/IdentityCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/identities/{identityId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
      - name: identityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: unlinkUserIdentity
      tags: [Identity & Role]
      summary: 사용자 identity 연결 해제
      description: 사용자 계정에 연결된 identity를 해제합니다.
      responses:
        '200': {$ref: '#/components/responses/IdentityOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/roles:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      operationId: listUserRoles
      tags: [Identity & Role]
      summary: 사용자 역할 목록 조회
      description: 사용자에게 부여된 역할과 기관 범위를 조회합니다.
      responses:
        '200': {$ref: '#/components/responses/RoleListOk'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: assignUserRole
      tags: [Identity & Role]
      summary: 사용자 역할 부여
      description: 사용자에게 기관 범위 역할을 부여합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleAssignmentRequest'}
      responses:
        '201': {$ref: '#/components/responses/RoleCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/{userId}/roles/{roleId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
      - name: roleId
        in: path
        required: true
