      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId: {type: [string, 'null'], format: uuid}
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: learner@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          writeOnly: true
          description: UTF-8 기준 72바이트 이하의 비밀번호입니다.
        name: {type: string, minLength: 1, maxLength: 100, example: 홍길동}
        phone: {type: [string, 'null'], maxLength: 30, example: 010-1234-5678}
        birthDate: {type: [string, 'null'], format: date, example: '1995-05-10'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: learner@example.com
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    SessionRole:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [LEARNER, INSTITUTION_ADMIN, INSTRUCTOR, PLATFORM_ADMIN]
        institutionId:
          type: [string, 'null']
          format: uuid
          description: >-
            LEARNER에서 null이면 모든 기관 과정에 신청 가능한 전역 학습자입니다.
            INSTITUTION_ADMIN과 INSTRUCTOR는 기관 UUID가 필수입니다.
