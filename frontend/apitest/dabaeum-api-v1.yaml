      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CompletionEvaluationRequest:
      type: object
      additionalProperties: false
      description: >-
        출석률·이수시간·학점은 서버가 출결 기록과 과정 정책으로 계산해 판정합니다.
        보낸 값은 참고용이며 서버 계산값과 달라도 거부하지 않습니다. 판정에 쓰인 값은
        응답의 attendanceRate·completedMinutes·creditValue 에 담깁니다. 빈 본문(`{}`)도 허용됩니다.
      properties:
        attendanceRate: {type: [number, 'null'], format: double, minimum: 0, maximum: 100}
        completedMinutes: {type: [integer, 'null'], format: int32, minimum: 0}
        creditValue: {type: [number, 'null'], format: double, minimum: 0.01, maximum: 999.99}
        failureReason: {type: [string, 'null'], maxLength: 1000}
    Credential:
      type: object
      additionalProperties: false
      required:
        [id, credentialGroupId, credentialNo, versionNo, credentialType,
         status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        credentialGroupId: {type: string, format: uuid}
        previousCredentialId: {type: [string, 'null'], format: uuid}
        credentialNo: {type: string, maxLength: 100}
        versionNo: {type: integer, format: int32, minimum: 1}
        issuerIdentifier: {type: [string, 'null'], maxLength: 512}
        subjectIdentifier: {type: [string, 'null'], maxLength: 512}
        credentialType: {type: string, maxLength: 100}
        status:
          type: string
          enum: [PENDING, ISSUING, ISSUED, FAILED, REVOKED, SUPERSEDED, EXPIRED]
        validFrom: {type: [string, 'null'], format: date-time}
        validUntil: {type: [string, 'null'], format: date-time}
        vcHash: {type: [string, 'null'], pattern: '^[0-9a-fA-F]{64}$'}
        issuedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        revocationReason: {type: [string, 'null'], maxLength: 1000}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CredentialDetail:
      type: object
      additionalProperties: false
      description: >-
        Credential 조회 응답입니다. 발급 근거가 된 과정 정보를 함께 담습니다.
        과정 정보는 원장에 앵커되는 VC payload 에는 포함되지 않으며 조회 경로에서만 제공합니다.
      required:
        [id, credentialGroupId, credentialNo, versionNo, credentialType,
         status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        credentialGroupId: {type: string, format: uuid}
        previousCredentialId: {type: [string, 'null'], format: uuid}
        credentialNo: {type: string, maxLength: 100}
        versionNo: {type: integer, format: int32, minimum: 1}
        issuerIdentifier: {type: [string, 'null'], maxLength: 512}
        subjectIdentifier: {type: [string, 'null'], maxLength: 512}
        credentialType: {type: string, maxLength: 100}
        status:
          type: string
          enum: [PENDING, ISSUING, ISSUED, FAILED, REVOKED, SUPERSEDED, EXPIRED]
        validFrom: {type: [string, 'null'], format: date-time}
        validUntil: {type: [string, 'null'], format: date-time}
        vcHash: {type: [string, 'null'], pattern: '^[0-9a-fA-F]{64}$'}
        issuedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        revocationReason: {type: [string, 'null'], maxLength: 1000}
        failureCode:
          type: [string, 'null']
          maxLength: 100
          description: >-
            status 가 FAILED 일 때만 값이 있는 실패 코드입니다(예 CREDENTIAL_SIGNING_KEY_INACTIVE).
            화면 문구는 클라이언트가 코드로 정합니다. 실패 시각은 updatedAt 입니다.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        courseId: {type: [string, 'null'], format: uuid}
        courseTitle: {type: [string, 'null'], maxLength: 200}
        courseCode: {type: [string, 'null'], maxLength: 50}
        institutionName: {type: [string, 'null'], maxLength: 200}
    CredentialIssueRequest:
      type: object
      additionalProperties: false
      properties:
        validUntil: {type: [string, 'null'], format: date-time}
    CredentialRevokeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CredentialReissueRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        validUntil: {type: [string, 'null'], format: date-time}
    CredentialVerifyRequest:
      type: object
      additionalProperties: false
      required: [verificationType, requesterType]
      anyOf:
        - required: [credentialNo]
        - required: [credentialHash]
      properties:
        credentialNo: {type: string, minLength: 1, maxLength: 100}
        credentialHash: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        verificationType: {type: string, enum: [QR, API, ADMIN]}
        requesterType:
          type: string
          enum: [INDIVIDUAL, INSTITUTION, EXTERNAL_ORGANIZATION, SYSTEM]
        requesterId: {type: [string, 'null'], maxLength: 255}
    CredentialVerification:
      type: object
      additionalProperties: false
      required: [id, verificationType, requesterType, result, verificationScope, verifiedAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        credentialId: {type: [string, 'null'], format: uuid}
        presentedCredentialNo: {type: [string, 'null'], maxLength: 100}
        verificationType: {type: string, enum: [QR, API, ADMIN]}
        requesterType:
          type: string
          enum: [INDIVIDUAL, INSTITUTION, EXTERNAL_ORGANIZATION, SYSTEM]
        requesterId: {type: [string, 'null'], maxLength: 255}
        result:
          type: string
          enum: [VALID, INVALID, REVOKED, SUPERSEDED, EXPIRED, NOT_FOUND, ERROR]
        verificationScope:
          type: string
          enum: [PLATFORM, PLATFORM_CONDITIONAL]
          description: PLATFORM_CONDITIONAL 은 유출 선언된 키 버전으로 서명됐지만 원장 최초 기록이 유출 이전이라 플랫폼이 조건부로 인정한 결과입니다. 발급자 문서에서 그 키가 빠지므로 외부 독립 검증기는 거부하며, 소지자에게 재발급을 안내합니다.
        verifiedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        issuerName: {type: [string, 'null'], description: 유효하게 서명된 수료증의 발급기관 이름}
        issuedAt: {type: [string, 'null'], format: date-time, description: 유효하게 서명된 수료증의 발급 시각}
    LearningBadge:
      type: object
      additionalProperties: false
      required: [id, userId, badgeType, badgeName, status, createdAt, updatedAt, issuerName]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        courseId: {type: [string, 'null'], format: uuid}
        credentialId: {type: [string, 'null'], format: uuid}
        badgeType: {type: string, maxLength: 50}
        badgeName: {type: string, maxLength: 200}
        status: {type: string, enum: [PENDING, ISSUED, FAILED, REVOKED]}
        nftTokenId: {type: [string, 'null'], maxLength: 255}
        issuedAt: {type: [string, 'null'], format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        definitionId: {type: [string, 'null'], format: uuid, description: 정의로 준 배지면 정의 id. 정의 없이 준 옛 배지는 null}
        definitionCode: {type: [string, 'null']}
        imageUrl: {type: [string, 'null'], description: '공개 경로 /api/v1/files/{id}/content. 단계 배지는 현재 단계 이미지, 없으면 정의 이미지'}
        issuerName: {type: string, description: 발급기관. 다배움}
        recipientName: {type: [string, 'null'], description: 수혜자 이름}
        recipientLearnerNo: {type: [string, 'null'], description: 수혜자 평생학번}
        tierLevel: {type: [integer, 'null'], minimum: 1, maximum: 10, description: 단계 배지의 현재 단계}
        tierName: {type: [string, 'null'], example: 새싹}
        criteria: {type: [string, 'null'], description: '이수기준 문장. 분류는 이름으로 나온다. 예) 강좌 이수 건수 — 씨앗 1~5건, 새싹 6~10건, …'}
        expiresAt: {type: [string, 'null'], format: date-time, description: 만료일. 정책 확정 전까지 null(만료 없음)}
        lastEvent:
          type: [object, 'null']
          additionalProperties: false
          required: [type, reason, occurredAt]
          description: 가장 최근 변동. type 이 RENEWED 면 상태를 "갱신" 으로 표시한다
          properties:
            type: {type: string, enum: [ISSUED, RENEWED, REVOKED, RESTORED]}
            reason: {type: string}
            occurredAt: {type: string, format: date-time}
    BadgeIssueRequest:
      type: object
      additionalProperties: false
      required: [definitionId]
      properties:
        definitionId: {type: string, format: uuid, description: 발급할 배지 정의(사용 중이어야 한다). 배지 종류·이름은 정의에서 온다}
        courseId: {type: [string, 'null'], format: uuid}
    AttendanceQrToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt, attendUrl]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
        attendUrl:
          type: string
          description: >-
            강사 화면이 QR 로 그릴 문자열입니다. 서버가 조립하므로 프론트는 그대로 QR 로 만들면 됩니다.
            학생이 폰 기본 카메라로 찍으면 {attend-base-url}/attend?t={token} 이 열리고 다대구 앱
            인증으로 이어집니다. 앞부분은 서버 설정 dabaeum.attendance.dadaegu.attend-base-url 이며
            학생 폰에서 닿는 값이어야 합니다. 이 값을 프론트 주소로 바꾸면 프론트 학생 페이지가
            openAttendSession·getAttendSession 을 부르고, 바꾸기 전에는 서버의 HTML 페이지가 열립니다.
