      type: object
      additionalProperties: false
      required: [userId, provider, roles, expiresAt]
      properties:
        userId: {type: string, format: uuid}
        provider: {type: string, enum: [LOCAL, DADAEGU, DID]}
        roles:
          type: array
          items: {$ref: '#/components/schemas/SessionRole'}
        expiresAt: {type: [string, 'null'], format: date-time}
    SessionResponse:
