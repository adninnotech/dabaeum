          type: [string, 'null']
          format: date-time
          description: >-
            마지막 처리 시각. 철회·취소·거절·승인 중 마지막으로 일어난 것이며 강좌별 목록
            Enrollment.processedAt 과 같은 규칙이다. 처리 전(APPLIED·WAITLISTED)이면 null.
        waitlistPosition:
          type: [integer, 'null']
          description: >-
            같은 강좌 대기자 중 순번(1부터, 신청 시각 순). 상태·검색 필터나 페이지와 상관없이
            강좌 전체 대기열 기준이다. 대기(WAITLISTED)가 아니면 null.
