      properties:
        learnerNo:
          type: [string, 'null']
          description: 평생학번 9자리 숫자.
        email:
          type: [string, 'null']
          maxLength: 320
          description: 이메일. 대소문자·앞뒤 공백 무시.
        birthDate:
          type: string
