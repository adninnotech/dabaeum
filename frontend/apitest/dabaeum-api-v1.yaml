        totalCount: {type: integer, format: int64, minimum: 0}
        inProgressCount: {type: integer, format: int64, minimum: 0}
        completedCount: {type: integer, format: int64, minimum: 0}
        totalStudyMinutes: {type: integer, format: int64, minimum: 0}
        averageProgressPercent: {type: integer, minimum: 0, maximum: 100}
        inquiryCount: {type: integer, format: int64, minimum: 0}
    UserLearningStatsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/UserLearningStats'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    LearningCourse:
      type: object
      additionalProperties: false
      required:
        [enrollmentId, courseId, title, status, appliedAt, attendedCount, progressPercent]
      properties:
        enrollmentId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        title: {type: string, maxLength: 200}
        status: {type: string, enum: [APPLIED, IN_PROGRESS, COMPLETED]}
        startDate: {type: [string, 'null'], format: date}
        endDate: {type: [string, 'null'], format: date}
        appliedAt: {type: string, format: date-time}
        institutionName: {type: [string, 'null'], maxLength: 200}
        instructorName: {type: [string, 'null'], maxLength: 100}
        classificationCode: {type: [string, 'null'], pattern: '^TSIX_[0-9]{6}$', description: 표준 강좌 분류 코드(설계서 §12). 하위가 없는 코드만 붙일 수 있다}
        classificationPath:
          type: array
          items: {type: string}
          description: 표시용 분류 경로(1→3단계 이름). 분류가 없으면 빈 배열
        educationType: {type: [string, 'null'], enum: [OFFLINE, ONLINE, HYBRID, null]}
        sessionCount:
          type: [integer, 'null']
          format: int32
          minimum: 0
          description: >-
            취소되지 않은 전체 회차 수. `GET /enrollments/{id}/progress` 의 sessionCount 는
            아직 출결 창이 열리지 않은 회차를 뺀 "출결 대상 회차" 수라 분모가 다를 수 있다.
        tags: {type: [string, 'null'], maxLength: 60}
        tuitionType: {type: [string, 'null'], enum: [FREE, PAID, null]}
        tuitionAmount: {type: [number, 'null'], format: double, minimum: 0}
        thumbnailFileId: {type: [string, 'null'], format: uuid}
        attendedCount:
          type: integer
          format: int64
          minimum: 0
          description: PRESENT·LATE 로 기록된 출석 수(지각도 출석으로 센다).
        progressPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >-
            attendedCount / sessionCount(전체 회차 기준) 를 반올림한 값. 회차가 0개면 0.
            `GET /enrollments/{id}/progress` 의 progressPercent 와 분모가 달라 두 값이
            다르게 나올 수 있다 — 그쪽은 출결 대상 회차만 분모로 쓴다.
    LearningCoursePageResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningCourse'}}
        page: {$ref: '#/components/schemas/PageMeta'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    EnrollmentProgress:
      type: object
      additionalProperties: false
      required:
        [enrollmentId, userId, userName, courseId, courseTitle,
         attendedCount, sessionCount, progressPercent, attendanceRate, status]
      properties:
        enrollmentId: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        userName: {type: string, maxLength: 100}
        courseId: {type: string, format: uuid}
        courseTitle: {type: string, maxLength: 200}
        attendedCount: {type: integer, format: int64, minimum: 0}
        sessionCount:
          type: integer
          format: int64
          minimum: 0
          description: >-
            취소되지 않은 회차 수. 나의 강의 목록 카드의 sessionCount 와 같은 기준이라
            같은 수강신청이면 두 화면의 progressPercent 가 일치한다.
        progressPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 학습 진도. 출석 인정(PRESENT·LATE) 회차 / 취소되지 않은 전체 회차.
        attendanceRate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: >-
            출석률. GET /enrollments/{enrollmentId}/attendance-summary 의 attendanceRate 와 같은 규칙과 값입니다
            (종료·창이 지난 회차 + 기록이 있는 진행 중 회차, 지각은 출석, 공결은 분모 제외).
        status:
          type: string
          enum: [APPLIED, WAITLISTED, APPROVED, REJECTED, CANCELLED, WITHDRAWN]
        lastStudiedAt:
          type: [string, 'null']
          format: date-time
          description: 마지막 출석(PRESENT·LATE) 시각. 출석 기록이 없으면 null.
        birthDate: {type: [string, 'null'], format: date}
        gender: {type: [string, 'null'], enum: [MALE, FEMALE, UNDISCLOSED, null]}
        email: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        profileImageId: {type: [string, 'null'], format: uuid}
    EnrollmentProgressEnvelopeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/EnrollmentProgress'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    EnrollmentProgressPageResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/EnrollmentProgress'}}
        page: {$ref: '#/components/schemas/PageMeta'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
    FileUploadRequest:
