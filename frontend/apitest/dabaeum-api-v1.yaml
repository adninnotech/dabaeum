      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        phone: {type: [string, 'null'], maxLength: 30}
        birthDate: {type: [string, 'null'], format: date}
    Identity:
      type: object
