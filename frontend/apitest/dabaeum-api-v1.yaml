      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [COURSE_COMPLETION, CUMULATIVE, TIERED]}
        courseId: {type: [string, 'null'], format: uuid, description: COURSE_COMPLETION 에서 classificationCode 대신}
        classificationCode:
          type: [string, 'null']
          pattern: '^TSIX_[0-9]{6}$'
          description: 어느 단계든 하위 분류를 포함한다. COURSE_COMPLETION 에서는 courseId 대신, CUMULATIVE 에서는 선택
        count: {type: [integer, 'null'], minimum: 1, maximum: 1000, description: CUMULATIVE 의 누적 수료 개수}
        levels:
          type: [array, 'null']
          minItems: 2
          maxItems: 10
          description: >-
            TIERED 의 단계 기준표. level 은 1부터 연속, minCount 는 오름차순. 강좌 이수 건수가 minCount 이상인 가장 높은 단계가 된다.
            발급된 배지가 있어도 단계 이름·이미지는 바꿀 수 있지만 minCount·단계 수·분류는 바꿀 수 없다(409 BADGE_DEFINITION_IN_USE).
