        attendanceOpensAt: {type: [string, 'null'], format: date-time}
        attendanceClosesAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [SCHEDULED, OPEN, COMPLETED, CANCELLED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CourseSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [sessionNo]
      properties:
        sessionNo: {type: integer, format: int32, minimum: 1}
        startsAt:
          type: [string, 'null']
          format: date-time
          description: 온라인 회차는 생략한다. endsAt 과 함께 있거나 함께 없어야 한다.
        endsAt: {type: [string, 'null'], format: date-time}
        location: {type: [string, 'null'], maxLength: 500}
        topic:
          type: string
          maxLength: 200
          description: 회차 주제. 커리큘럼 테이블의 주제 열에 표시된다.
        attendanceOpensAt: {type: [string, 'null'], format: date-time}
        attendanceClosesAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [SCHEDULED, OPEN, COMPLETED, CANCELLED], default: SCHEDULED}
