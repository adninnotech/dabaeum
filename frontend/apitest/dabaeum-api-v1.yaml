      properties:
        provider: {type: string, enum: [LOCAL, DADAEGU, DID]}
        providerSubject: {type: string, minLength: 1, maxLength: 255}
        externalDid: {type: [string, 'null'], maxLength: 512}
        verified: {type: boolean}
    Role:
      type: object
      additionalProperties: false
