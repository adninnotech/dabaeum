          type: array
          items: {$ref: '#/components/schemas/EnrollmentBulkDecisionFailure'}
    Attendance:
      type: object
      additionalProperties: false
      required:
        [id, courseId, sessionId, enrollmentId, attendanceMethod, status,
         source, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        enrollmentId: {type: string, format: uuid}
        attendanceMethod: {type: string, enum: [QR, QR_DADAEGU, ADMIN, EXTERNAL]}
        status: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        checkedAt: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [APP, ADMIN_WEB, EXTERNAL_API]}
        createdBy: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        userId:
          type: string
          format: uuid
          description: 회차 출결 목록(listSessionAttendance)에서만 싣는 수강생 사용자 식별자입니다. 단건 응답에는 없습니다.
        userName:
          type: string
          maxLength: 100
          description: 회차 출결 목록에서만 싣는 수강생 이름입니다. 강사 화면이 수강신청 id 대신 보여 줍니다.
        adjustments:
          type: array
          description: 출결 단건 조회(getAttendance)에서만 싣는 보정 이력입니다. 최신순이며 보정이 없으면 빈 배열입니다.
          items: {$ref: '#/components/schemas/AttendanceAdjustment'}
    AttendanceAdjustment:
      type: object
      additionalProperties: false
      required: [id, fromStatus, toStatus, reason, adjustedBy, adjustedAt]
      properties:
        id: {type: string, format: uuid}
        fromStatus: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        toStatus: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        reason: {type: string, minLength: 1, maxLength: 1000}
        adjustedBy: {type: string, format: uuid}
        adjustedByName:
          type: [string, 'null']
          maxLength: 100
          description: 보정한 사용자 이름입니다. 사용자 행이 없으면 null 입니다.
        adjustedAt: {type: string, format: date-time}
    AttendanceCreateRequest:
      type: object
      additionalProperties: false
      required: [enrollmentId, attendanceMethod, status, source]
      properties:
        enrollmentId: {type: string, format: uuid}
        attendanceMethod: {type: string, enum: [QR, QR_DADAEGU, ADMIN, EXTERNAL]}
        status: {type: string, enum: [PRESENT, LATE, ABSENT, EXCUSED]}
        checkedAt: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [APP, ADMIN_WEB, EXTERNAL_API]}
