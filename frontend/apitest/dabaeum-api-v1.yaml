      description: >-
        기간 안의 배지 발급(issued)·폐기(revoked)를 groupBy 축으로 셉니다. DEFINITION 은 배지 정의별이며, 정의 없이 준 옛 배지는
        key NONE("정의 없음(옛 배지)") 로 묶습니다. 플랫폼 관리자 전용입니다.
      parameters:
        - {name: groupBy, in: query, required: true, schema: {type: string, enum: [YEAR, MONTH, DEFINITION]}}
        - {name: from, in: query, schema: {type: string, format: date}, description: 서울 날짜. 기본 올해 1월 1일}
        - {name: to, in: query, schema: {type: string, format: date}, description: 서울 날짜(포함). 기본 오늘. 최대 5년}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}, description: csv 면 UTF-8 BOM 을 붙인 text/csv 로 내려받는다(관리자 접속기록에 DOWNLOAD 로 남는다)}
      responses:
