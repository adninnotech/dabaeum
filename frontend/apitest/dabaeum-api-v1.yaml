      summary: 관리자 목록 조회
      description: >-
        PLATFORM_ADMIN 또는 INSTITUTION_ADMIN 역할이 있는 계정을 가입 최신순으로 조회합니다. 플랫폼 관리자 전용입니다.
        q 는 이름·이메일 부분일치(대소문자 무시) 또는 평생학번 완전일치입니다. lockedUntil 은 지금 잠겨 있을 때만,
        passwordChangedAt 이 null 이면 임시 비밀번호입니다. 역할 변경은 /users/{userId}/roles, 비활성화는
        /users/{userId}/status 를 씁니다. 조회는 관리자 접속기록에 남습니다.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: role, in: query, schema: {type: string, enum: [PLATFORM_ADMIN, INSTITUTION_ADMIN]}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, DORMANT, WITHDRAWN, SUSPENDED]}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}}
      responses:
        '200': {$ref: '#/components/responses/AdministratorPageOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    post:
      operationId: createAdministrator
      tags: [Admin]
      summary: 관리자 계정 생성
      description: >-
        이름·이메일·역할(·기관)로 관리자 계정을 만듭니다. LOCAL 로그인 수단과 임시 비밀번호, 평생학번(구·군 99)이 함께
        발급되며 약관 이력은 남기지 않습니다. INSTITUTION_ADMIN 은 institutionId 가 필수이고 PLATFORM_ADMIN 은 비워 둡니다.
        임시 비밀번호는 이 응답에서 한 번만 보이며, 첫 로그인부터 세션의 passwordExpired 가 true 라 변경을 안내합니다.
        이메일이 이미 쓰이면 409 IDENTITY_CONFLICT, 없는 기관은 404, 학번 소진은 503 LEARNER_NO_EXHAUSTED 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministratorCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/AdministratorCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
