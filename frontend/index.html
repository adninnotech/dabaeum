<!doctype html>
<html lang="ko">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="theme-color" content="#1a479f" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="icon" type="image/svg+xml" href="<%= process.env.BASE_URL %>icons/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="<%= process.env.BASE_URL %>icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="<%= process.env.BASE_URL %>icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= process.env.BASE_URL %>icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= process.env.BASE_URL %>icons/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="<%= process.env.BASE_URL %>favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= process.env.BASE_URL %>icons/apple-touch-icon.png"
    />
    <link
      rel="mask-icon"
      href="<%= process.env.BASE_URL %>icons/safari-pinned-tab.svg"
      color="#1a479f"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
